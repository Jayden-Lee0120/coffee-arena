<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17130E">
<title>커피 결투장</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#17130E; --surface:#221C15; --surface2:#2F271D; --line:#463A2B;
  --cream:#F3E8D6; --muted:#A5917A; --amber:#F5A524; --ember:#FF5C3E; --mint:#4ED9A4;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--cream);font-family:var(--body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
body.noscroll{overflow:hidden;touch-action:none}   /* 과녁 진행 중 화면 흔들림 방지 */
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}
img{max-width:100%}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% -10%, rgba(245,165,36,.10), transparent 60%),var(--ground)}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:19px;letter-spacing:.02em;line-height:1}
.brand .bcup{color:var(--amber)}
.topbar .spacer{flex:1}
.livecount{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;
  font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(78,217,164,.16)}
.dot.off{background:var(--ember);box-shadow:none}
.dot.idle{background:var(--muted);box-shadow:none}
.me-chip{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:4px 9px}
.abortbtn{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;color:var(--ember);
  background:rgba(255,92,62,.14);border:1px solid rgba(255,92,62,.5);white-space:nowrap}
.me-chip.editable{color:var(--cream);border-color:var(--amber);cursor:pointer}
.me-chip:disabled{cursor:default}
#stage{flex:1;padding:18px 16px 8px;display:flex;flex-direction:column;gap:16px}

.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1.title{font-family:var(--display);font-size:30px;line-height:1.18;margin:4px 0 0;text-wrap:balance}
h2.title{font-family:var(--display);font-size:23px;line-height:1.25;margin:2px 0 0;text-wrap:balance}
p.lead{margin:0;color:var(--muted);font-size:14px}
.note{font-size:12.5px;color:var(--muted);text-align:center}
.center{text-align:center}
.hidden{display:none !important}

.field{display:flex;flex-direction:column;gap:8px}
label.lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text]{width:100%;padding:14px 15px;font-size:17px;font-family:var(--body);background:var(--surface);
  color:var(--cream);border:1px solid var(--line);border-radius:12px}
input[type=text]::placeholder{color:#6E5C48}
input.codein{font-family:var(--mono);font-size:22px;letter-spacing:.3em;text-align:center;text-transform:uppercase}
.emojigrid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.emojigrid button{aspect-ratio:1;font-size:20px;border-radius:10px;background:var(--surface);
  border:1px solid var(--line);display:grid;place-items:center}
.emojigrid button[aria-pressed=true]{background:rgba(245,165,36,.16);border-color:var(--amber)}

.btn{display:block;width:100%;padding:15px;border-radius:13px;font-family:var(--display);font-size:18px;
  background:var(--amber);color:#1B1409}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--cream)}
.btn.danger{background:var(--ember);color:#241009}
.btn.sm{padding:11px;font-size:15px}
.btnrow{display:flex;gap:9px}
.btnrow .btn{flex:1}

/* 방 코드 */
.roomcode{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line)}
.roomcode .lab2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.roomcode .code{font-family:var(--mono);font-size:38px;font-weight:600;letter-spacing:.14em;color:var(--amber);line-height:1}
.roomcode .qr{background:#F3E8D6;padding:8px;border-radius:10px;display:grid;place-items:center}
.roomcode .qr img,.roomcode .qr canvas{display:block;width:132px;height:132px}

.menu{display:flex;flex-direction:column;gap:10px}
.gcard{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;width:100%;text-align:left;
  padding:14px 15px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.gcard .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:21px;background:var(--surface2)}
.gcard[data-g=nerve] .ic{background:rgba(255,92,62,.14)}
.gcard[data-g=bomb] .ic{background:rgba(245,165,36,.14)}
.gcard[data-g=unique] .ic{background:rgba(78,217,164,.14)}
.gcard .nm{display:block;font-family:var(--display);font-size:17px;line-height:1.2}
.gcard .ds{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.gcard .go{font-family:var(--mono);font-size:12px;color:var(--amber)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
.rulelist{margin:0;padding-left:17px;font-size:13px;color:var(--muted);line-height:1.7}
.rulelist b{color:var(--cream);font-weight:700}
.rulelist .hot{color:var(--ember);font-weight:700}
.rulelist .cool{color:var(--mint);font-weight:700}

.bigtime{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:52px;font-weight:600;line-height:1;
  text-align:center;letter-spacing:-.02em}
.bigtime .u{font-size:20px;color:var(--muted);margin-left:3px}
.deadline{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.deadline i{display:block;height:100%;background:var(--amber);width:100%}
.deadline.warn i{background:var(--ember)}

.holdwrap{display:grid;place-items:center;padding:6px 0 2px}
.hold{width:min(66vw,236px);aspect-ratio:1;border-radius:50%;touch-action:none;-webkit-user-select:none;user-select:none;
  background:radial-gradient(circle at 50% 38%,#3A2E20,#241C13 70%);border:2px solid var(--line);
  display:grid;place-items:center;gap:2px;align-content:center;
  box-shadow:0 12px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
  transition:transform .09s ease,border-color .15s,background .15s}
.hold .hl{font-family:var(--display);font-size:21px}
.hold .hs{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.hold[data-state=holding]{transform:scale(.965);border-color:var(--ember);
  background:radial-gradient(circle at 50% 38%,#5A2A1C,#2A1710 72%);animation:pulse 1s ease-in-out infinite}
.hold[data-state=holding] .hl{color:var(--ember)}
.hold[data-state=boom]{border-color:var(--ember);background:radial-gradient(circle at 50% 40%,#7A2718,#2A130C 72%)}
.hold[data-state=done]{border-color:var(--mint);background:radial-gradient(circle at 50% 40%,#1E4436,#16241E 72%)}
.hold[data-state=done] .hl{color:var(--mint)}
@keyframes pulse{0%,100%{box-shadow:0 12px 34px rgba(0,0,0,.45),0 0 0 0 rgba(255,92,62,.32)}
  50%{box-shadow:0 12px 34px rgba(0,0,0,.45),0 0 0 16px rgba(255,92,62,0)}}

.bombstage{display:grid;place-items:center;gap:12px;padding:4px 0}
.bombface{width:min(50vw,180px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-size:min(19vw,70px);background:radial-gradient(circle at 50% 36%,#3A2E20,#221A12 72%);border:2px solid var(--line)}
.bombface.mine{border-color:var(--ember);animation:shake .42s linear infinite}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2px,1px) rotate(-2deg)}
  50%{transform:translate(2px,-1px) rotate(2deg)}75%{transform:translate(-1px,-1px) rotate(-1deg)}}
.holderline{text-align:center;font-family:var(--display);font-size:22px}
.holderline em{font-style:normal;color:var(--amber)}
.passgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.passgrid button{padding:11px 6px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.passgrid button .e{font-size:20px}
.passgrid button .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.passgrid button:disabled{opacity:.3}
.passgrid button:not(:disabled):active{background:rgba(245,165,36,.18);border-color:var(--amber)}

/* 1~50 을 담아야 하므로 칸을 가로로 넓고 세로로 낮게 — 탭 영역은 지키면서 전체 높이를 줄인다 */
/* 야바위 — 컵은 위가 좁은 사다리꼴로 세우고, 공은 컵 아래 바닥에 둔다.
   선택자는 반드시 .cups 안으로 한정한다 (예전에 로고의 .cup 과 부딪혀 화면을 가린 적이 있다). */
.cups{position:relative;height:21vw;max-height:92px;margin:10px 0 2px;
  border-bottom:2px solid var(--line)}
.cups .cup{position:absolute;left:8%;bottom:2px;width:21%;height:88%;
  clip-path:polygon(17% 0,83% 0,100% 100%,0 100%);
  background:linear-gradient(170deg,#E7643F,#B23A1C 62%,#8A2A12);
  border:0;border-radius:3px 3px 5px 5px;padding:0;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.22), inset 0 -10px 14px rgba(0,0,0,.35);
  transform-origin:50% 100%;will-change:transform;
  transition:bottom .18s ease;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
.cups .cup::after{content:"";position:absolute;left:24%;right:24%;top:9%;height:10%;border-radius:50%;
  background:rgba(255,255,255,.16)}
.cups .cup.up{bottom:46%}
.cups .cup.pickable{cursor:pointer;box-shadow:inset 0 3px 0 rgba(255,255,255,.22),
  inset 0 -10px 14px rgba(0,0,0,.35), 0 0 0 2px var(--amber)}
.cups .cup.pickable:active{filter:brightness(1.25)}
.cups .ball{position:absolute;left:8%;bottom:4px;width:21%;text-align:center;font-size:min(5vw,20px);
  line-height:1;z-index:0;color:#F3E8D6;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.slotlab{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:5px;
  font-family:var(--mono);font-size:11px;color:var(--muted)}

/* 과녁 맞추기 */
.aimhud{display:flex;align-items:baseline;justify-content:center;gap:6px}
.aimhud .as{font-family:var(--mono);font-size:40px;font-weight:600;font-variant-numeric:tabular-nums}
.aimhud .au{font-size:15px;color:var(--muted)}
.aimhud .ah{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:8px}
.aimarea{position:relative;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;
  background:
    radial-gradient(circle at 30% 25%, rgba(245,165,36,.07), transparent 55%),
    repeating-linear-gradient(0deg,transparent 0 23px,rgba(70,58,43,.35) 23px 24px),
    repeating-linear-gradient(90deg,transparent 0 23px,rgba(70,58,43,.35) 23px 24px),
    var(--surface);
  border:1px solid var(--line);-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;cursor:crosshair;
  /* 판 안에서 끌어도 화면이 스크롤되지 않게 한다 */
  touch-action:none;overscroll-behavior:contain}
/* 글리프보다 넉넉한 정사각형 탭 영역을 줘서 조금 빗나가도 맞도록 한다 */
.tgt{position:absolute;left:50%;top:50%;width:27%;aspect-ratio:1;min-width:66px;
  display:grid;place-items:center;font-size:min(12vw,46px);line-height:1;border-radius:50%;
  transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none;
  transition:opacity .08s linear, transform .13s cubic-bezier(.2,1.5,.4,1);
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.tgt[data-on="1"]{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto;cursor:pointer}
.tgt[data-on="1"]:active{transform:translate(-50%,-50%) scale(1.12)}
.aflash{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:17px;
  font-weight:600;opacity:0;pointer-events:none;z-index:5}
.aflash.good{color:var(--mint)}
.aflash.bad{color:var(--ember)}
.aflash.go{animation:flup .45s ease-out forwards}
@keyframes flup{0%{opacity:1;transform:translate(-50%,-50%) scale(.85)}
  100%{opacity:0;transform:translate(-50%,-190%) scale(1.15)}}

/* 참가자 관리 · 관전 */
.mlist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:11px;overflow:hidden}
.mrow{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;padding:9px 11px;
  background:var(--surface);font-size:13.5px}
.mrow.spec{opacity:.55}
.mrow .mn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mn em{font-style:normal;font-size:11px;color:var(--amber);margin-left:3px}
.mrow .mt{font-family:var(--mono);font-size:11px;color:var(--muted)}
.mrow .kick{font-size:11px;padding:4px 9px;border-radius:999px;color:var(--ember);
  background:rgba(255,92,62,.12);border:1px solid rgba(255,92,62,.45)}
.btn.ghost.on{border-color:var(--amber);color:var(--amber)}
.chip.spec{opacity:.5}
.diag{margin:10px 0 0;font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all}

/* 게임 랜덤 고르기 */
.pickbox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 18px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);text-align:center;transition:border-color .2s}
.pickbox.hit{border-color:var(--amber);background:linear-gradient(180deg,rgba(245,165,36,.16),rgba(245,165,36,.03))}
.pickbox .pkic{font-size:52px;line-height:1}
.pickbox .pknm{font-family:var(--display);font-size:27px;line-height:1.2}
.pickbox.hit .pknm{color:var(--amber)}
.pickbox .pkds{font-size:13px;color:var(--muted);max-width:32ch}

/* 초성 퀴즈 */
.chobox{display:flex;flex-direction:column;align-items:center;gap:7px;padding:18px 14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line)}
.chobox .lab2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chobox .chobig{font-family:var(--display);font-size:60px;line-height:1.05;letter-spacing:.12em;color:var(--amber)}
.cstat{min-height:20px;text-align:center;font-size:13.5px;color:var(--muted)}
.cstat.ok{color:var(--mint);font-weight:700}
.cstat.rej{color:var(--ember);font-weight:700}
.cstat.chk{color:var(--amber)}
#cw{text-align:center;font-size:24px;letter-spacing:.1em}

/* 가위바위보 */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:16px 12px}
.vsside{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.vsl{font-size:12px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vshand{font-size:44px;line-height:1.1}
.vsx{font-family:var(--display);font-size:15px;color:var(--muted)}
.rpsrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.rpsrow button{padding:16px 6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:5px}
.rpsrow button .h{font-size:34px;line-height:1}
.rpsrow button .n{font-size:13px;color:var(--muted)}
.rpsrow button[aria-pressed=true]{background:rgba(245,165,36,.16);border-color:var(--amber)}
.rpsrow button[aria-pressed=true] .n{color:var(--amber)}
.rpsrow button:disabled{opacity:.4}
.cpuhand{display:flex;flex-direction:column;align-items:center;gap:5px;padding:16px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line)}
.cpuhand .lab2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.cpuhand .big{font-size:56px;line-height:1.1}
.cpuhand .nm2{font-family:var(--display);font-size:19px;color:var(--amber)}

/* 룰렛 */
.wheelwrap{position:relative;display:grid;place-items:center;padding:8px 0 4px}
.wheelptr{position:absolute;top:-3px;left:50%;margin-left:-11px;z-index:2;width:0;height:0;
  border-left:11px solid transparent;border-right:11px solid transparent;border-top:21px solid var(--cream);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.wheel{width:min(78vw,300px);aspect-ratio:1;border-radius:50%;display:block;
  border:3px solid var(--surface2);box-shadow:0 10px 30px rgba(0,0,0,.5);
  transform:rotate(0deg);transition:transform 5.2s cubic-bezier(.15,.72,.14,1)}
.wheelhub{position:absolute;width:42px;height:42px;border-radius:50%;background:var(--surface);
  border:2px solid var(--line);display:grid;place-items:center;font-size:18px;pointer-events:none}

/* 반응속도 */
.pad{width:100%;min-height:220px;border-radius:16px;display:grid;place-items:center;align-content:center;
  gap:7px;text-align:center;padding:22px;border:2px solid var(--line);background:var(--surface);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;cursor:pointer;
  transition:background .06s linear,border-color .06s linear}
.pad .pl{font-family:var(--display);font-size:25px;line-height:1.25}
.pad .ps{font-size:13px;color:var(--muted)}
.pad[data-s=wait]{background:#5E2118;border-color:var(--ember)}
.pad[data-s=wait] .pl{color:#FFDBD2}
.pad[data-s=wait] .ps{color:#EBAA99}
.pad[data-s=go]{background:#1C7150;border-color:var(--mint)}
.pad[data-s=go] .pl{color:#EAFFF6;font-size:38px}
.pad[data-s=early]{background:#6B4A12;border-color:var(--amber)}
.pad[data-s=early] .pl{color:#FFE9C2}
.pad[data-s=early] .ps{color:#D8B77A}
.pad[data-s=res] .pl,.pad[data-s=done] .pl{font-family:var(--mono);font-size:40px;color:var(--mint);
  font-variant-numeric:tabular-nums}
.pad[data-s=done]{border-color:rgba(78,217,164,.55)}
.trials{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.trial{font-family:var(--mono);font-size:12px;padding:5px 9px;border-radius:999px;background:var(--surface);
  border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.trial.on{border-color:var(--mint);color:var(--mint)}
.trial.bad{border-color:rgba(255,92,62,.6);color:var(--ember)}

/* 로비 게임 옵션 */
.gwrap{display:flex;flex-direction:column}
.gwrap .gcard{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:0}
.opts{display:flex;align-items:center;gap:7px;padding:10px 15px;background:var(--surface2);
  border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px}
.opts .ol{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.opts button{padding:6px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font-family:var(--mono);font-size:13px;color:var(--muted)}
.opts button[aria-pressed=true]{background:var(--amber);color:#1B1409;border-color:var(--amber)}

const CHO_TABLE=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function choOf(ch){
  const c=ch.charCodeAt(0)-0xAC00;
  return (c<0||c>11171)?null:CHO_TABLE[Math.floor(c/588)];
}
function choKey(w){
  if(w.length!==2) return null;
  const a=choOf(w[0]), b=choOf(w[1]);
  return (a&&b)?a+b:null;
}

const CHO_PAIRS=(function(){

  CHO_ALL.forEach(w=>{

  });

})();

let wakeLock=null;
async function keepAwake(on){
  try{
    if(on && !wakeLock && navigator.wakeLock){ wakeLock=await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release",()=>{wakeLock=null;}); }
    else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){}
}

const Net={
  role:null,          // 'host' | 'guest'
  peer:null,
  code:"",
  conns:new Map(),    // host: peerId -> conn
  hostConn:null,      // guest
  ok:false,
  err:""
};

function netSend(msg){                       // 게스트 → 방장 (방장이면 직접 처리)
  if(Net.role==="host") return handleAction(ME.id,msg);
  if(Net.hostConn && Net.hostConn.open){ try{ Net.hostConn.send(msg); }catch(e){} }
}
function netBroadcast(){                     // 방장 → 전원
  if(Net.role!=="host") return;
  for(const [pid,c] of Net.conns){
    if(!c.open) continue;
    try{ c.send({t:"state", s:publicState(pid)}); }catch(e){}
  }
  RECV.at=Date.now(); RECV.remain=ST.remain;   // 방장 본인 화면도 같은 기준으로
  render();
}

/* 휴대폰 통신망(특히 LTE)은 대칭형 NAT 을 쓰는 경우가 많아 STUN 만으로는 기기끼리 직접 연결되지
   않는다. 그때는 TURN 서버가 중계해 줘야 붙는다 — 아이폰만 접속이 안 되던 증상의 가장 흔한 원인. */
const PEER_CFG={
  debug:0,
  config:{
    iceServers:[
      {urls:"stun:stun.l.google.com:19302"},
      {urls:"stun:stun1.l.google.com:19302"},
      {urls:"turn:openrelay.metered.ca:80",  username:"openrelayproject", credential:"openrelayproject"},
      {urls:"turn:openrelay.metered.ca:443", username:"openrelayproject", credential:"openrelayproject"},
      {urls:"turn:openrelay.metered.ca:443?transport=tcp", username:"openrelayproject", credential:"openrelayproject"}
    ]
  }
};
function makePeer(id){
  return new Promise((resolve,reject)=>{
    const p=new Peer(id,PEER_CFG);
    let settled=false;
    const to=setTimeout(()=>{ if(!settled){ settled=true; try{p.destroy();}catch(e){} reject({type:"timeout"}); } },20000);
    p.on("open",()=>{ if(settled) return; settled=true; clearTimeout(to); resolve(p); });
    p.on("error",e=>{ if(settled) return; settled=true; clearTimeout(to); try{p.destroy();}catch(x){} reject(e); });
  });
}

async function hostRoom(){
  showConnecting("방을 만드는 중…");
  for(let attempt=0;attempt<6;attempt++){
    const code=randCode(4);
    try{
      const p=await makePeer(PREFIX+code);
      Net.peer=p; Net.role="host"; Net.code=code; Net.ok=true;
      ME.id=p.id; screen="game";
      initHostState();
      p.on("connection",c=>wireHostConn(c));
      p.on("error",e=>{ if(e && e.type==="peer-unavailable") return; toast("연결 오류: "+(e&&e.type||"unknown")); });
      p.on("disconnected",()=>{ Net.ok=false; render(); try{p.reconnect();}catch(e){} });
      location.hash=code;
      render();
      return;
    }catch(e){
      if(e && e.type==="unavailable-id") continue;      // 코드 충돌 → 재시도
      showFatal(e);
      return;
    }
  }
  showFatal({type:"unavailable-id"});
}

function wireHostConn(c){
  // 기기에 따라 'open' 보다 첫 데이터가 먼저 도착한다. 그때 conns 에 없으면 그 사람에게만
  // 상태가 영영 안 가서 접속 화면에 갇히므로, 어느 쪽이 먼저 오든 여기서 등록한다.
  const register=()=>{ if(!Net.conns.has(c.peer)) Net.conns.set(c.peer,c); };
  c.on("open",()=>{
    register();
    try{ c.send({t:"hello", you:c.peer, code:Net.code}); }catch(e){}
    netBroadcast();
  });
  c.on("data",d=>{
    if(!d||typeof d!=="object") return;
    register();
    if(d.t==="join"){
      if(HOST.kicked[c.peer] && Date.now()-HOST.kicked[c.peer]<60000){
        try{ c.send({t:"kicked"}); }catch(e){}
        setTimeout(()=>{ try{ c.close(); }catch(e){} },250);
        return;
      }
      if(!ST.players[c.peer] && Object.keys(ST.players).length>=MAXP){
        try{ c.send({t:"full"}); }catch(e){}
        return;
      }
      ST.players[c.peer]={name:String(d.name||"익명").slice(0,8), emoji:String(d.emoji||"👤").slice(0,4), on:true};
      if(ST.order.indexOf(c.peer)<0) ST.order.push(c.peer);
      netBroadcast();
      setTimeout(netBroadcast,400);        // 채널이 늦게 열리는 기기 대비
      return;
    }
    handleAction(c.peer,d);
  });
  const bye=()=>{
    Net.conns.delete(c.peer);
    if(ST.players[c.peer]) ST.players[c.peer].on=false;
    netBroadcast();
  };
  c.on("close",bye);
  c.on("error",bye);
}

async function joinRoom(code){
  showConnecting(code+" 방에 접속 중…");
  try{
    const p=await makePeer(undefined);
    Net.peer=p; Net.role="guest"; Net.code=code; ME.id=p.id;
    const c=p.connect(PREFIX+code,{reliable:true});
    let opened=false;
    const to=setTimeout(()=>{ if(!opened){ showFatal({type:"nochannel"}); } },20000);
    c.on("open",()=>{
      opened=true; clearTimeout(to); Net.hostConn=c; Net.ok=true; screen="game";
      const join=()=>{ try{ c.send({t:"join", name:ME.name, emoji:ME.emoji}); }catch(e){} };
      join();
      // 연결은 됐는데 방 상태가 안 오면 접속 화면에 갇힌다. 몇 번 더 조르고, 그래도 없으면 알린다.
      let tries=0;
      const nag=setInterval(()=>{
        if(ST||!Net.hostConn){ clearInterval(nag); return; }
        if(++tries>5){ clearInterval(nag); showFatal({type:"nostate"}); return; }
        join();
      },1500);
      location.hash=code;
      render();
    });
    c.on("data",d=>{
      if(!d||typeof d!=="object") return;
      if(d.t==="state") applyState(d.s);
      else if(d.t==="full") showFatal({type:"full"});
      else if(d.t==="kicked"){ Net.hostConn=null; showFatal({type:"kicked"}); }
    });
    const dead=()=>{ Net.ok=false; Net.hostConn=null; render(); };
    c.on("close",dead); c.on("error",dead);
    p.on("error",e=>{ if(!opened){ clearTimeout(to); showFatal(e); } });
  }catch(e){ showFatal(e); }
}

/* ================= 방장 전용 게임 상태 ================= */
let ST=null;      // 방장: 실제 상태 / 게스트: 수신한 공개 상태
let HOST=null;    // 방장만 갖는 비공개 데이터 (숫자 서바이벌 제출값 등)
const RECV={at:0, remain:0};   // 마지막 상태 수신 시각과 그때의 남은 시간

function initHostState(){
  ST={
    code:Net.code, hostId:ME.id,
    players:{}, order:[],
    phase:"lobby", game:null, roundKey:null, stage:null, boom:false, spin:null,
    roster:[], alive:[], uniRound:1, maxNum:20, rpsRound:1, cpu:null, trials:REACT_TRIALS, cho:null,
    cafes:[], cafePick:null, shell:null, shellRound:1, shellAns:null, aim:null,
    holder:null, from:null, passes:0,
    entries:{}, board:null, note:"", loser:null, lastLoser:null,
    rematch:0, remain:0
  };
  ST.players[ME.id]={name:ME.name, emoji:ME.emoji, on:true};
  ST.order.push(ME.id);
  HOST={picks:{}, rps:{}, cpu:0, bombStart:0, bombTick:0, phaseStart:0, handAt:0, lastB:0,
        fuse:0, goAt:0, boomAt:0, spinAt:0, roulLoser:null, taken:{}, seq:0,
        kicked:{}, pickGame:null, shellPick:{}, shellAns:0, next:null};
}

/* 게스트에게 보내는 상태. ST.entries 에는 애초에 숫자를 담지 않으므로(HOST.picks 에만 보관)
   공개 전까지 어떤 기기에도 남의 숫자가 전송되지 않는다. 받는 사람 본인 것만 되돌려 준다. */
function publicState(forId){
  if(ST.phase!=="play") return ST;
  const secret = ST.game==="unique" ? HOST.picks[forId]
               : ST.game==="rps"    ? HOST.rps[forId] : null;
  if(secret!=null){
    const e=Object.assign({},ST.entries);
    e[forId]={submitted:true, mine:secret};
    return Object.assign({},ST,{entries:e});
  }
  return ST;
}

const onlineIds=()=> (ST?ST.order.filter(id=>ST.players[id]&&ST.players[id].on):[]);
// 관전으로 빠진 사람은 새 판의 참가자 명단에서 제외된다
const playingIds=()=> onlineIds().filter(id=>!ST.players[id].spec);

/* 실제로 있는 낱말인지 확인.
   위키백과는 인물·지명·상표 같은 표제어까지 잡혀서 "사전에 있는 단어"와 거리가 멀어 빼고,
   낱말만 싣는 위키낱말사전만 본다. 기본 목록에 있으면 조회 없이 즉시 통과.
   "없다"는 답을 받았을 때만 탈락시키고, 조회 자체가 실패하면 인정한다(판이 막히면 안 되므로). */
function lookupWord(w){
  if(CHO_WORDS.has(w)) return Promise.resolve(true);
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),3500);
  return fetch("https://ko.wiktionary.org/w/api.php?action=query&format=json&origin=*&titles="+
               encodeURIComponent(w), {signal:ctl.signal})
    .then(r=>r.ok?r.json():Promise.reject(new Error("http")))
    .then(j=>{
      const pages=j&&j.query&&j.query.pages;
      for(const k in pages) if(!("missing" in pages[k])) return true;
      return false;
    })
    .catch(()=>true)
    .then(v=>{ clearTimeout(timer); return v; });
}

function handleAction(from,d){
  if(Net.role!=="host"||!ST) return;
  switch(d.t){
    case "start": if(from!==ST.hostId) return; return startGame(d.game,d.trials,d.cafes);
    case "lobby": if(from!==ST.hostId) return; return toLobby();
    case "nerve": {
      if(ST.phase!=="play"||ST.game!=="nerve") return;
      if(ST.roster.indexOf(from)<0) return;
      const cur=ST.entries[from]||{};
      if(cur.state==="done"||cur.state==="boom") return;          // 이미 확정
      if(d.state==="holding"){
        if(ST.stage!=="hold") return;
        ST.entries[from]={state:"holding", delay:clamp(Math.round(d.delay||0),0,99999)};
      }else{
        // 버틴 시간은 각자 기기가 잰 값. 통신 지연과 무관하게 같은 폭탄 시간과 비교된다.
        const held=Math.max(0,Math.round(d.held||0));
        const delay=cur.delay!=null?cur.delay:99999;
        ST.entries[from] = held>=HOST.fuse
          ? {state:"boom", score:0, held:Math.round(HOST.fuse), delay}
          : {state:"done", score:Math.round(held/10), held, delay};
      }
      return netBroadcast();
    }
    case "pass": {
      if(ST.phase!=="play"||ST.game!=="bomb") return;
      if(ST.holder!==from) return;
      if(Date.now()-HOST.handAt<BOMB_MIN_HOLD) return;
      if(ST.order.indexOf(d.to)<0 || d.to===from) return;
      ST.holder=d.to; ST.from=from; ST.passes++; HOST.handAt=Date.now();
      return netBroadcast();
    }
    case "pick": {
      if(ST.phase!=="play"||ST.game!=="unique") return;
      if(ST.alive.indexOf(from)<0) return;
      if(HOST.picks[from]!=null) return;
      const n=Math.round(d.num);
      if(!(n>=1&&n<=ST.maxNum)) return;
      HOST.picks[from]=n;
      ST.entries[from]={submitted:true};   // 숫자는 HOST.picks 에만 남는다
      return netBroadcast();
    }
    case "rps": {
      if(ST.phase!=="play"||ST.game!=="rps") return;
      if(ST.alive.indexOf(from)<0) return;
      if(HOST.rps[from]!=null) return;
      const h=Math.round(d.hand);
      if(!(h>=0&&h<=2)) return;
      HOST.rps[from]=h;
      ST.entries[from]={submitted:true};   // 낸 손은 HOST.rps 에만 남는다
      return netBroadcast();
    }
    case "cho": {
      if(ST.phase!=="play"||ST.game!=="cho"||ST.stage!=="go") return;
      if(ST.roster.indexOf(from)<0) return;
      const cur=ST.entries[from]||{};
      if(cur.ok||cur.checking) return;                 // 이미 확정했거나 확인 중
      const w=String(d.word||"").replace(/\s+/g,"");
      // 형식과 선점은 도착 즉시 동기적으로 판정해야 같은 단어를 두 명이 먹지 않는다
      if(choKey(w)!==ST.cho){ ST.entries[from]={rej:"form"}; return netBroadcast(); }
      if(HOST.taken[w]!=null){ ST.entries[from]={rej:"dup"}; return netBroadcast(); }
      const seq=++HOST.seq;
      HOST.taken[w]=from;                              // 사전 확인 동안 이 단어를 잠가 둔다
      ST.entries[from]={word:w, seq, checking:true};
      netBroadcast();
      lookupWord(w).then(found=>{
        if(!ST||ST.game!=="cho") return;
        const e=ST.entries[from];
        if(!e||e.word!==w||!e.checking) return;
        if(found) ST.entries[from]={word:w, seq, ok:true};
        else { delete HOST.taken[w]; ST.entries[from]={rej:"nodict"}; }
        netBroadcast();
      });
      return;
    }
    case "randomPick": {
      if(from!==ST.hostId||ST.phase!=="lobby") return;
      // 뽑은 게임은 공개 직전까지 방장만 알고 있어서 미리 볼 수 없다
      HOST.pickGame=PLAY_GAMES[Math.floor(Math.random()*PLAY_GAMES.length)];
      HOST.pickTrials=clamp(Math.round(d.trials||REACT_TRIALS),1,20);
      HOST.phaseStart=Date.now(); HOST.lastB=0;
      ST.phase="picking"; ST.stage="shuffle"; ST.pickGame=null;
      ST.remain=PICK_SHUFFLE; ST.aborted=false;
      return netBroadcast();
    }
    case "spec": {                                     // 각자 자기 관전 여부만 바꾼다
      const p=ST.players[from]; if(!p) return;
      p.spec=!!d.on;
      return netBroadcast();
    }
    case "kick": {
      if(from!==ST.hostId||d.id===ST.hostId) return;   // 방장은 자기를 못 내보낸다
      const id=d.id, c=Net.conns.get(id);
      if(c){ try{ c.send({t:"kicked"}); }catch(e){} setTimeout(()=>{ try{ c.close(); }catch(e){} },250); }
      Net.conns.delete(id);
      delete ST.players[id];
      const i=ST.order.indexOf(id); if(i>=0) ST.order.splice(i,1);
      HOST.kicked[id]=Date.now();                      // 바로 다시 들어오는 것 방지
      return netBroadcast();
    }
    case "cafeAdd": {
      if(from!==ST.hostId||ST.game!=="cafe"||ST.stage!=="setup") return;
      const n=String(d.name||"").trim().slice(0,16);
      if(!n||ST.cafes.length>=MAX_CAFE||ST.cafes.indexOf(n)>=0) return;
      ST.cafes.push(n); return netBroadcast();
    }
    case "cafeDel": {
      if(from!==ST.hostId||ST.game!=="cafe"||ST.stage!=="setup") return;
      const i=Math.round(d.i);
      if(i<0||i>=ST.cafes.length) return;
      ST.cafes.splice(i,1); return netBroadcast();
    }
    case "cafeSpin": {
      if(from!==ST.hostId||ST.game!=="cafe"||ST.stage!=="setup") return;
      const n=ST.cafes.length; if(!n) return;
      const k=Math.floor(Math.random()*n), slice=360/n, center=(k+0.5)*slice;
      const jitter=(Math.random()-0.5)*slice*0.7;
      HOST.cafeIdx=k; HOST.spinAt=Date.now(); ST.stage="spin";
      ST.spin={deg:Math.round((360*6+(360-center-jitter))*100)/100, dur:ROUL_SPIN};
      return netBroadcast();
    }
    case "shell": {
      if(ST.phase!=="play"||ST.game!=="shell"||ST.stage!=="pick") return;
      if(ST.alive.indexOf(from)<0) return;
      if(HOST.shellPick[from]!=null) return;
      const c=Math.round(d.cup);
      if(!(c>=0&&c<=2)) return;
      HOST.shellPick[from]=c;
      ST.entries[from]={submitted:true};     // 고른 컵은 HOST 에만 남는다
      return netBroadcast();
    }
    case "aim": {
      if(ST.phase!=="play"||ST.game!=="aim") return;
      if(ST.roster.indexOf(from)<0) return;
      if((ST.entries[from]||{}).done) return;
      ST.entries[from]={done:true, score:clamp(Math.round(d.score||0),-9999,99999),
                        hits:clamp(Math.round(d.hits||0),0,300)};
      return netBroadcast();
    }
    case "spin": {
      if(ST.phase!=="play"||ST.game!=="roul") return;
      if(from!==ST.hostId) return;                       // 룰렛은 방장만 돌린다
      if(ST.stage!=="idle") return;
      const n=ST.roster.length; if(!n) return;
      const k=Math.floor(Math.random()*n);
      const slice=360/n;
      const center=(k+0.5)*slice;
      const jitter=(Math.random()-0.5)*slice*0.7;        // 칸 정중앙만 맞지 않도록
      HOST.roulLoser=ST.roster[k]; HOST.spinAt=Date.now();
      ST.stage="spin";
      ST.spin={deg:Math.round((360*6+(360-center-jitter))*100)/100, dur:ROUL_SPIN};
      return netBroadcast();
    }
    case "react": {
      if(ST.phase!=="play"||ST.game!=="react") return;
      if(ST.roster.indexOf(from)<0) return;
      const cur=ST.entries[from]||{};
      if(cur.done) return;
      if(d.done) ST.entries[from]={n:ST.trials, done:true,
        best:clamp(Math.round(d.best||99999),1,99999), fails:clamp(Math.round(d.fails||0),0,20)};
      else ST.entries[from]={n:clamp(Math.round(d.n||0),0,ST.trials)};
      return netBroadcast();
    }
  }
}

function startGame(g,trials,cafes){
  if(!GAMES[g]||g==="random") return;
  const roster = g==="cafe" ? onlineIds() : playingIds();
  if(!roster.length){ if(Net.role==="host") toast("참가할 사람이 없어요"); return; }
  if(g==="react") ST.trials=clamp(Math.round(trials||REACT_TRIALS),1,20);
  ST.phase="play"; ST.game=g; ST.roundKey=g+"-"+Date.now().toString(36);
  ST.roster=roster.slice(); ST.entries={}; ST.board=null; ST.note=""; ST.loser=null;
  ST.rematch=0; ST.from=null; ST.passes=0;
  HOST.picks={}; HOST.phaseStart=Date.now(); HOST.next=null; HOST.lastB=0;
  ST.remain = g==="nerve"?NV_COUNT : g==="unique"?UNI_LIMIT : g==="react"?REACT_LIMIT
            : g==="rps"?RPS_LIMIT : g==="cho"?NV_COUNT
            : g==="shell"?SHELL_PEEK : g==="aim"?AIM_COUNT : 0;
  ST.stage=null; ST.boom=false; ST.spin=null; ST.cpu=null; ST.aborted=false;
  if(g==="nerve"){
    // 이번 라운드의 폭탄 시간은 단 하나. 전원에게 똑같이 적용되며 방장 기기 밖으로 나가지 않는다.
    HOST.fuse=FUSE_MIN+Math.random()*(FUSE_MAX-FUSE_MIN);
    HOST.goAt=0; HOST.boomAt=0; ST.stage="count";
  }
  if(g==="roul"){ ST.stage="idle"; HOST.spinAt=0; HOST.roulLoser=null; }
  if(g==="rps"){
    ST.alive=roster.slice(); ST.rpsRound=1;
    // 컴퓨터의 손은 라운드 시작 시점에 확정되고 공개 전까지 방송되지 않는다
    HOST.rps={}; HOST.cpu=Math.floor(Math.random()*3);
  }
  if(g==="cho"){
    // 문제는 방장만 들고 있다가 카운트다운이 끝나는 순간 공개한다
    HOST.cho=CHO_PAIRS[Math.floor(Math.random()*CHO_PAIRS.length)];
    ST.cho=null; ST.stage="count";
    HOST.taken={}; HOST.seq=0;
  }
  if(g==="shell"){
    ST.alive=roster.slice(); ST.shellRound=1; ST.shellAns=null; ST.stage="peek";
    const pos0=Math.floor(Math.random()*3), seq=makeShuffleSeq();
    ST.shell={pos0,seq};                       // 정답은 방장만 계산해 둔다
    HOST.shellAns=shellAnswer(pos0,seq); HOST.shellPick={};
  }
  if(g==="aim"){
    ST.stage="count"; ST.aim={seq:makeAimSeq()};
  }
  if(g==="cafe"){
    ST.stage="setup"; ST.cafePick=null; HOST.cafeIdx=-1; HOST.spinAt=0;
    ST.cafes=Array.isArray(cafes)
      ? cafes.map(s=>String(s).trim().slice(0,16)).filter((s,i,a)=>s&&a.indexOf(s)===i).slice(0,MAX_CAFE)
      : [];
  }
  if(g==="bomb"){ ST.holder=roster[Math.floor(Math.random()*roster.length)]; HOST.handAt=Date.now();
    HOST.bombStart=Date.now(); HOST.bombTick=Date.now();
    // 이번 판의 폭탄 시간. 방장 기기 밖으로 나가지 않으므로 아무도 미리 알 수 없다
    HOST.bombFuse=BOMB_FUSE_MIN+Math.random()*(BOMB_FUSE_MAX-BOMB_FUSE_MIN); }
  if(g==="unique"){ ST.alive=roster.slice(); ST.uniRound=1; ST.maxNum=UNI_MAX; }
  netBroadcast();
}
function toLobby(){
  ST.aborted = (ST.phase==="play"||ST.phase==="reveal");   // 결과를 못 보고 접은 판인지
  ST.phase="lobby"; ST.game=null; ST.roundKey=null; ST.entries={}; ST.board=null;
  ST.lastLoser=ST.loser||ST.lastLoser; ST.loser=null; ST.note="";
  ST.stage=null; ST.boom=false; ST.spin=null; ST.cpu=null; ST.cho=null; ST.pickGame=null;
  ST.shell=null; ST.shellAns=null; ST.aim=null;
  HOST.picks={}; HOST.rps={}; HOST.taken={}; HOST.seq=0; HOST.next=null; HOST.pickGame=null;
  HOST.shellPick={};
  netBroadcast();
}

/* ---- 방장 루프: 타이머 · 판정 ---- */
function hostTick(){
  if(Net.role!=="host"||!ST) return;
  const now=Date.now();

  // 진행 중에는 1초에 한 번만 방송하고, 그 사이 카운트다운은 각 기기가 보간한다.
  const beat=()=>{ if(now-HOST.lastB>=1000){ HOST.lastB=now; netBroadcast(); } };

  if(ST.phase==="play"&&ST.game==="bomb"){
    const total=now-HOST.bombStart;
    ST.remain=total;
    const dt=now-HOST.bombTick;
    if(dt<100) return;
    HOST.bombTick=now;

    if(!ST.players[ST.holder]||!ST.players[ST.holder].on){       // 든 사람이 나갔으면 인계
      const alt=onlineIds();
      if(alt.length && now-HOST.handAt>6000){
        ST.holder=alt[Math.floor(Math.random()*alt.length)]; ST.from=null; HOST.handAt=now;
        return netBroadcast();
      }
    }
    if(total>=HOST.bombFuse){
      const L=ST.holder;
      ST.phase="result"; ST.loser=L; ST.lastLoser=L;
      ST.note="폭탄 "+fmt(HOST.bombFuse)+"초 · "+ST.passes+"번 돌았습니다";
      ST.board=ST.roster.map(id=>({id,label:id===L?"💥":"세이프",loser:id===L}));
      return netBroadcast();
    }
    return beat();
  }

  if(ST.phase==="play"&&ST.game==="nerve"){
    if(ST.stage==="count"){                                  // 3 · 2 · 1
      ST.remain=Math.max(0,NV_COUNT-(now-HOST.phaseStart));
      if(ST.remain>0) return beat();
      ST.stage="hold"; HOST.goAt=now; ST.remain=NV_CAP; HOST.lastB=0;
      return netBroadcast();                                 // 동시 출발 신호
    }
    const el=now-HOST.goAt;
    ST.remain=Math.max(0,NV_CAP-el);
    if(!ST.boom && el>=HOST.fuse){                           // 전원 동시 폭발
      ST.boom=true; HOST.boomAt=now; netBroadcast();
    }
    const done=ST.roster.every(id=>{
      const e=ST.entries[id]; return e&&(e.state==="done"||e.state==="boom");
    });
    if(done) return resolveNerve();
    if(ST.boom && now-HOST.boomAt>=NV_GRACE) return resolveNerve();
    if(ST.remain<=0) return resolveNerve();
    return beat();
  }

  if(ST.phase==="play"&&ST.game==="unique"){
    ST.remain=Math.max(0,UNI_LIMIT-(now-HOST.phaseStart));
    if(ST.alive.every(id=>HOST.picks[id]!=null)||ST.remain<=0) return resolveUnique();
    return beat();
  }

  if(ST.phase==="play"&&ST.game==="roul"){
    if(ST.stage==="spin"&&now-HOST.spinAt>=ROUL_SPIN+700) resolveRoul();
    return;                                   // 대기 중에는 바뀌는 게 없으니 방송하지 않는다
  }

  if(ST.phase==="play"&&ST.game==="cafe"){
    if(ST.stage==="spin"&&now-HOST.spinAt>=ROUL_SPIN+700){
      ST.phase="result"; ST.loser=null; ST.board=null;
      ST.cafePick=ST.cafes[HOST.cafeIdx]||"";
      ST.note=ST.cafes.length+"곳 중에서";
      netBroadcast();
    }
    return;
  }

  if(ST.phase==="play"&&ST.game==="react"){
    ST.remain=Math.max(0,REACT_LIMIT-(now-HOST.phaseStart));
    if(ST.roster.every(id=>ST.entries[id]&&ST.entries[id].done)||ST.remain<=0) return resolveReact();
    return beat();
  }

  if(ST.phase==="play"&&ST.game==="rps"){
    ST.remain=Math.max(0,RPS_LIMIT-(now-HOST.phaseStart));
    if(ST.alive.every(id=>HOST.rps[id]!=null)||ST.remain<=0) return resolveRps();
    return beat();
  }

  if(ST.phase==="play"&&ST.game==="shell"){
    if(ST.stage==="peek"){
      ST.remain=Math.max(0,SHELL_PEEK-(now-HOST.phaseStart));
      if(ST.remain>0) return beat();
      ST.stage="shuffle"; HOST.phaseStart=now; ST.remain=SHELL_MS; HOST.lastB=0;
      return netBroadcast();
    }
    if(ST.stage==="shuffle"){
      ST.remain=Math.max(0,SHELL_MS-(now-HOST.phaseStart));
      if(ST.remain>0) return beat();
      ST.stage="pick"; HOST.phaseStart=now; ST.remain=SHELL_PICK; HOST.lastB=0;
      return netBroadcast();
    }
    ST.remain=Math.max(0,SHELL_PICK-(now-HOST.phaseStart));
    if(ST.alive.every(id=>HOST.shellPick[id]!=null)||ST.remain<=0) return resolveShell();
    return beat();
  }

  if(ST.phase==="play"&&ST.game==="aim"){
    if(ST.stage==="count"){
      ST.remain=Math.max(0,AIM_COUNT-(now-HOST.phaseStart));
      if(ST.remain>0) return beat();
      ST.stage="run"; HOST.phaseStart=now; ST.remain=AIM_MS; HOST.lastB=0;
      return netBroadcast();
    }
    ST.remain=Math.max(0,AIM_MS-(now-HOST.phaseStart));
    if(ST.roster.every(id=>ST.entries[id]&&ST.entries[id].done)) return resolveAim();
    if(now-HOST.phaseStart>AIM_MS+4000) return resolveAim();   // 보고가 안 와도 종료
    return beat();
  }

  if(ST.phase==="play"&&ST.game==="cho"){
    if(ST.stage==="count"){                                  // 3 · 2 · 1 뒤 동시에 공개
      ST.remain=Math.max(0,NV_COUNT-(now-HOST.phaseStart));
      if(ST.remain>0) return beat();
      ST.stage="go"; ST.cho=HOST.cho;
      HOST.phaseStart=now; ST.remain=CHO_LIMIT; HOST.lastB=0;  // 제한시간은 공개 시점부터
      return netBroadcast();
    }
    ST.remain=Math.max(0,CHO_LIMIT-(now-HOST.phaseStart));
    const settled=ST.roster.every(id=>{ const e=ST.entries[id]; return e&&e.ok; });
    const pending=ST.roster.some(id=>{ const e=ST.entries[id]; return e&&e.checking; });
    if(settled||(ST.remain<=0&&!pending)) return resolveCho();
    if(ST.remain<=0&&now-HOST.phaseStart>CHO_LIMIT+5000) return resolveCho();  // 조회가 안 끝나도 종료
    return beat();
  }

  if(ST.phase==="picking"){
    if(ST.stage==="shuffle"){
      ST.remain=Math.max(0,PICK_SHUFFLE-(now-HOST.phaseStart));
      if(ST.remain>0) return beat();
      ST.stage="reveal"; ST.pickGame=HOST.pickGame;      // 여기서 공개
      HOST.phaseStart=now; ST.remain=PICK_REVEAL; HOST.lastB=0;
      return netBroadcast();
    }
    ST.remain=Math.max(0,PICK_REVEAL-(now-HOST.phaseStart));
    if(ST.remain<=0) return startGame(HOST.pickGame,HOST.pickTrials,cafeList);
    return beat();
  }

  if(ST.phase==="reveal"){
    ST.remain=Math.max(0,REVEAL_MS-(now-HOST.phaseStart));
    if(ST.remain<=0) return advance();
    return beat();
  }
}

function resolveShell(){
  const ans=HOST.shellAns;
  const board=ST.alive.map(id=>{
    const c=HOST.shellPick[id];
    return {id, cup:c!=null?c:null, win:c===ans};
  });
  const stay=board.filter(b=>!b.win).map(b=>b.id);
  const escaped=board.length-stay.length;
  ST.shellAns=ans;
  const txt=b=>b.cup==null?"미제출":(b.cup+1)+"번";

  if(stay.length===1){
    const L=stay[0];
    ST.phase="result"; ST.loser=L; ST.lastLoser=L;
    ST.note=ST.shellRound+"라운드 · 정답 "+(ans+1)+"번";
    ST.board=board.map(b=>({id:b.id, loser:b.id===L, label:txt(b)}));
    return netBroadcast();
  }
  const next = stay.length===0 ? ST.alive.slice() : stay;
  if(stay.length===0) board.forEach(b=>{ b.tag="무효"; });
  ST.phase="reveal"; ST.board=board;
  ST.note = stay.length===0
    ? "정답 "+(ans+1)+"번 · 전원 정답 → 무효, 다시"
    : "정답 "+(ans+1)+"번 · "+(escaped?escaped+"명 탈출 · ":"")+stay.length+"명 잔류";
  ST.remain=REVEAL_MS; HOST.phaseStart=Date.now(); HOST.lastB=0;
  HOST.next={game:"shell", alive:next, shellRound:ST.shellRound+1};
  netBroadcast();
}

function resolveAim(){
  const rows=ST.roster.map(id=>{
    const e=ST.entries[id]||{};
    return {id, done:!!e.done, score:e.done?e.score:-99999, hits:e.hits||0};
  }).sort((a,b)=> b.score-a.score || b.hits-a.hits);
  const L=rows[rows.length-1].id, top=rows[0];
  ST.phase="result"; ST.loser=L; ST.lastLoser=L;
  ST.note=(top.done?"1위 "+top.score+"점 · ":"")+"15초 과녁";
  ST.board=rows.map(b=>({id:b.id, loser:b.id===L,
    label: b.done ? b.score+"점 ("+b.hits+"개)" : "미참여"}));
  netBroadcast();
}

function resolveRps(){
  const cpu=HOST.cpu, winHand=(cpu+1)%3;               // 컴퓨터의 손을 이기는 손
  const board=ST.alive.map(id=>{
    const h=HOST.rps[id];
    return {id, hand:h!=null?h:null, win:h===winHand};
  });
  const stay=board.filter(b=>!b.win).map(b=>b.id);     // 지거나 비기거나 미제출 → 잔류
  const escaped=board.length-stay.length;
  ST.cpu=cpu;
  const handTxt=b=>b.hand==null?"미제출":RPS[b.hand].e+" "+RPS[b.hand].n;

  if(stay.length===1){
    const L=stay[0];
    ST.phase="result"; ST.loser=L; ST.lastLoser=L;
    ST.note=ST.rpsRound+"라운드 · 컴퓨터 "+RPS[cpu].e+" "+RPS[cpu].n;
    ST.board=board.map(b=>({id:b.id, loser:b.id===L, label:handTxt(b)}));
    return netBroadcast();
  }
  const next = stay.length===0 ? ST.alive.slice() : stay;   // 전원 승리면 무효 처리
  if(stay.length===0) board.forEach(b=>{ b.tag="무효"; });   // 이겼지만 아무도 못 빠지는 라운드
  ST.phase="reveal"; ST.board=board;
  ST.note = stay.length===0
    ? "컴퓨터 "+RPS[cpu].e+" · 전원 승리 → 무효, 다시"
    : "컴퓨터 "+RPS[cpu].e+" · "+(escaped?escaped+"명 탈출 · ":"")+stay.length+"명 잔류";
  ST.remain=REVEAL_MS; HOST.phaseStart=Date.now(); HOST.lastB=0;
  HOST.next={game:"rps", alive:next, rpsRound:ST.rpsRound+1};
  netBroadcast();
}

function resolveCho(){
  const rows=ST.roster.map(id=>{
    const e=ST.entries[id]||{};
    return {id, word:e.ok?e.word:null, seq:e.ok?e.seq:99999};
  }).sort((a,b)=>a.seq-b.seq);                        // 제출 도착 순서가 곧 순위
  const L=rows[rows.length-1].id;
  const solved=rows.filter(r=>r.word).length;
  ST.phase="result"; ST.loser=L; ST.lastLoser=L;
  ST.note="초성 "+ST.cho+" · "+solved+"/"+rows.length+"명 성공";
  ST.board=rows.map((b,i)=>({id:b.id, loser:b.id===L,
    label: b.word ? (i+1)+"등 "+b.word : "미제출"}));
  netBroadcast();
}

function resolveRoul(){
  const L=HOST.roulLoser;
  ST.phase="result"; ST.loser=L; ST.lastLoser=L;
  ST.note=ST.roster.length+"명 중 당첨";
  ST.board=ST.roster.map(id=>({id, label:id===L?"🎯 당첨":"세이프", loser:id===L}));
  netBroadcast();
}

function resolveReact(){
  const N=ST.trials;
  const rows=ST.roster.map(id=>{
    const e=ST.entries[id]||{};
    return {id, done:!!e.done, n:e.n||0, fails:e.fails||0, best:e.done?e.best:99999};
  }).sort((a,b)=> a.best-b.best);                     // 각자의 최고 기록으로 줄 세운다
  const L=rows[rows.length-1].id, top=rows[0];
  ST.phase="result"; ST.loser=L; ST.lastLoser=L;
  ST.note=(top.done&&top.best<99999?"1위 "+top.best+"ms · ":"")+N+"회 중 최고 기록 기준";
  ST.board=rows.map(b=>({id:b.id, loser:b.id===L,
    label: b.done ? (b.best<99999 ? b.best+"ms"+(b.fails?" ("+b.fails+"꽝)":"") : "전부 꽝")
                  : (b.n ? b.n+"/"+N+" 중단" : "미참여")}));
  netBroadcast();
}

function resolveNerve(){
  const fuse=Math.round(HOST.fuse);
  const board=ST.roster.map(id=>{
    const e=ST.entries[id]||{};
    if(e.state==="done") return {id, score:e.score, state:"done", held:e.held, delay:e.delay};
    if(e.state==="boom") return {id, score:0, state:"boom", held:e.held, delay:e.delay};
    // 폭발 때까지 손을 떼지 않았거나 아예 누르지 않은 사람
    return {id, score:0, state:e.state==="holding"?"boom":"miss",
            held:e.state==="holding"?fuse:0, delay:e.delay!=null?e.delay:99999};
  }).sort((a,b)=> b.score-a.score || a.delay-b.delay);

  const min=Math.min.apply(null,board.map(b=>b.score));
  let low=board.filter(b=>b.score===min);
  const fuseTxt="폭탄 "+fmt(fuse)+"초";

  if(low.length>1 && ST.rematch<MAX_REMATCH){
    ST.phase="reveal"; ST.board=board;
    ST.note=fuseTxt+" · "+low.length+"명 동점 → 재대결";
    ST.remain=REVEAL_MS; HOST.phaseStart=Date.now(); HOST.lastB=0;
    HOST.next={game:"nerve", roster:low.map(b=>b.id), rematch:ST.rematch+1};
    return netBroadcast();
  }
  // 끝까지 동점이면 시작 신호에 가장 늦게 반응한 사람이 진다
  if(low.length>1) low=low.slice().sort((a,b)=>b.delay-a.delay);
  const L=low[0].id;
  ST.phase="result"; ST.loser=L; ST.lastLoser=L; ST.board=board;
  ST.note=(ST.rematch?ST.rematch+"차 재대결 · ":"")+fuseTxt+" · 최저 "+min+"점";
  netBroadcast();
}

function resolveUnique(){
  const counts={};
  ST.alive.forEach(id=>{ const n=HOST.picks[id]; if(n!=null) counts[n]=(counts[n]||0)+1; });
  const board=ST.alive.map(id=>({id, num:HOST.picks[id]!=null?HOST.picks[id]:null,
      unique:HOST.picks[id]!=null&&counts[HOST.picks[id]]===1}))
    .sort((a,b)=>(a.num==null?999:a.num)-(b.num==null?999:b.num));
  const stay=ST.alive.filter(id=>HOST.picks[id]==null||counts[HOST.picks[id]]>1);

  const finish=(id,note)=>{
    ST.phase="result"; ST.loser=id; ST.lastLoser=id; ST.note=note;
    ST.board=board.map(b=>({id:b.id,label:b.num==null?"미제출":String(b.num),loser:b.id===id}));
    netBroadcast();
  };
  const cont=(ids,note)=>{
    ST.phase="reveal"; ST.board=board; ST.note=note;
    ST.remain=REVEAL_MS; HOST.phaseStart=Date.now(); HOST.lastB=0;
    HOST.next={game:"unique", alive:ids, uniRound:ST.uniRound+1};
    netBroadcast();
  };

  if(stay.length===0){
    const nums=ST.alive.map(id=>HOST.picks[id]).filter(n=>n!=null);
    const mx=Math.max.apply(null,nums);
    const tops=ST.alive.filter(id=>HOST.picks[id]===mx);
    if(tops.length===1) return finish(tops[0],"전원 다른 숫자 → 최고값 "+mx);
    return cont(tops,"최고값 "+mx+" 동점 → 재대결");
  }
  if(stay.length===1) return finish(stay[0],ST.uniRound+"라운드 · 마지막 한 명");
  const escaped=ST.alive.length-stay.length;
  cont(stay, escaped?escaped+"명 탈출 · "+stay.length+"명 잔류":"아무도 탈출하지 못했습니다");
}

function advance(){
  const n=HOST.next;
  if(!n) return toLobby();
  ST.phase="play"; ST.entries={}; ST.board=null; ST.note=""; HOST.picks={};
  HOST.phaseStart=Date.now(); HOST.next=null; HOST.lastB=0;
  ST.remain = n.game==="nerve"?NV_COUNT : n.game==="rps"?RPS_LIMIT : UNI_LIMIT;
  ST.stage=null; ST.boom=false; ST.cpu=null;
  if(n.game==="nerve"){
    ST.game="nerve"; ST.roundKey="nerve-"+Date.now().toString(36);
    ST.roster=n.roster; ST.rematch=n.rematch;
    HOST.fuse=FUSE_MIN+Math.random()*(FUSE_MAX-FUSE_MIN);   // 재대결마다 새로 뽑되, 역시 전원 동일
    HOST.goAt=0; HOST.boomAt=0; ST.stage="count";
  }else if(n.game==="shell"){
    ST.game="shell"; ST.roundKey="shell-"+Date.now().toString(36);
    ST.alive=n.alive; ST.shellRound=n.shellRound; ST.shellAns=null; ST.stage="peek";
    const pos0=Math.floor(Math.random()*3), seq=makeShuffleSeq();
    ST.shell={pos0,seq}; ST.remain=SHELL_PEEK;
    HOST.shellAns=shellAnswer(pos0,seq); HOST.shellPick={};
  }else if(n.game==="rps"){
    ST.game="rps"; ST.roundKey="rps-"+Date.now().toString(36);
    ST.alive=n.alive; ST.rpsRound=n.rpsRound;
    HOST.rps={}; HOST.cpu=Math.floor(Math.random()*3);      // 라운드마다 컴퓨터 손을 새로
  }else{
    ST.game="unique"; ST.roundKey="uni-"+Date.now().toString(36);
    ST.alive=n.alive; ST.uniRound=n.uniRound; ST.maxNum=UNI_MAX;
  }
  netBroadcast();
}

/* ================= 화면 ================= */
let viewKey="", refs={}, screen="name";
const nameOf =id=>(ST&&ST.players[id]?ST.players[id].name:"?");
const emojiOf=id=>(ST&&ST.players[id]?ST.players[id].emoji:"👤");

/* 남은 시간은 방장 시계가 기준. 수신 시각을 찍어 두고 그 사이는 각자 기기에서 보간해
   1초에 한 번만 방송해도 카운트다운이 매끄럽게 흐른다. */
function getRemain(){
  if(!ST) return 0;
  return Math.max(0, RECV.remain-(Date.now()-RECV.at));
}
function applyState(s){ ST=s; RECV.at=Date.now(); RECV.remain=s.remain||0; render(); }

function showConnecting(msg){ screen="connecting"; refs.msg=msg; viewKey=""; render(); }
function showFatal(e){
  screen="fatal";
  const t=(e&&e.type)||"";
  refs.msg =
    t==="peer-unavailable" ? "그런 방이 없어요. 코드를 다시 확인하거나, 방장에게 방이 아직 열려 있는지 물어보세요."
  : t==="unavailable-id"  ? "방 코드를 만들지 못했어요. 잠시 후 다시 시도해 주세요."
  : t==="full"            ? "방이 가득 찼어요 (최대 "+MAXP+"명)."
  : t==="browser-incompatible" ? "이 브라우저는 지원하지 않아요. Chrome이나 Safari로 열어 주세요."
  : t==="timeout"         ? "신호 서버에 닿지 못했어요. 네트워크를 확인하고 다시 시도해 주세요."
  : t==="nochannel"       ? "방은 찾았는데 기기끼리 연결되지 않았어요. 와이파이와 LTE를 서로 바꿔서 다시 시도해 보세요."
  : t==="nostate"         ? "방에는 닿았는데 방 정보를 받지 못했어요. 방장 화면이 켜져 있는지 확인하고 다시 시도해 주세요."
  : t==="kicked"          ? "방장이 내보냈어요."
  : "연결에 실패했어요. 다시 시도해 주세요.";
  // 기기에서 원인을 알려면 실제 코드가 필요하다
  refs.diag = t ? ("오류 코드: "+t+(e&&e.message?" · "+String(e.message).slice(0,120):"")) : "";
  viewKey=""; render();
}

let editMode=false;
function currentView(){
  if(screen==="connecting") return "conn";
  if(screen==="fatal") return "fatal";
  if(!ME.name||editMode) return "name";
  if(!Net.role) return "entry";
  if(!ST) return "conn";
  if(Net.role==="guest"&&!Net.ok) return "lost";
  const m=ST;
  if(m.phase==="lobby") return "lobby";
  const roster=(m.game==="unique"||m.game==="rps"||m.game==="shell")?(m.alive||[]):(m.roster||[]);
  if(m.phase==="play"){
    if(roster.indexOf(ME.id)<0) return "spec:"+m.roundKey;
    if(m.game==="bomb") return "bomb:"+m.roundKey+":"+(m.holder===ME.id?"h":"w");
    if(m.game==="nerve") return "nerve:"+m.roundKey;
    if(m.game==="roul") return "roul:"+m.roundKey;
    if(m.game==="react") return "react:"+m.roundKey;
    if(m.game==="rps") return "rps:"+m.roundKey+":"+(m.entries[ME.id]&&m.entries[ME.id].submitted?"s":"p");
    if(m.game==="cho") return "cho:"+m.roundKey;
    if(m.game==="cafe") return "cafe:"+m.roundKey;
    if(m.game==="shell") return "shell:"+m.roundKey;
    if(m.game==="aim") return "aim:"+m.roundKey;
    return "uni:"+m.roundKey+":"+(m.entries[ME.id]&&m.entries[ME.id].submitted?"s":"p");
  }
  if(m.phase==="picking") return "picking";
  if(m.phase==="reveal") return "reveal:"+m.roundKey+":"+m.note;
  if(m.phase==="result") return "result:"+m.roundKey;
  return "lobby";
}

let prevPhase="";
function render(){
  const p=ST?ST.phase:"";
  if(prevPhase&&prevPhase!=="lobby"&&p==="lobby"&&ST&&ST.aborted&&Net.role!=="host")
    toast("방장이 게임을 중단했어요");

      nerve:vNerve, bomb:vBomb, uni:vUni, roul:vRoul, react:vReact, rps:vRps, cho:vCho, cafe:vCafe,
      shell:vShell, aim:vAim,
      picking:vPicking, reveal:vReveal, result:vResult, spec:vSpec
     }[v.split(":")[0]]||vLobby)();

/* ---- 배짱 버튼 ----
   폭탄 시간은 방장이 라운드마다 하나만 뽑아 전원에게 똑같이 적용하고, 값 자체는 방송하지 않는다.
   모두 같은 신호에 동시 출발하므로 남의 점수를 먼저 보고 그보다 오래 버티는 것이 불가능하다. */
const nv={key:"",pressAt:0,goLocal:0,holding:false,fin:false,sentHold:false,painted:"",raf:0};
function heldNow(){
  if(!nv.goLocal||!nv.pressAt) return 0;
  return Math.max(0, Date.now()-Math.max(nv.pressAt,nv.goLocal));
}
function sendHold(){
  if(nv.sentHold||!nv.goLocal||!nv.holding) return;
  nv.sentHold=true;
  netSend({t:"nerve", state:"holding", delay:Math.max(0, nv.pressAt-nv.goLocal)});
}
function paintHolding(){
  if(!refs.nv) return;
  refs.nv.hb.dataset.state="holding";
  refs.nv.hl.textContent = nv.goLocal ? "버티는 중" : "준비 완료";
  if(!nv.goLocal) refs.nv.hs.textContent="신호 대기";
}
function paintNv(e){
  if(!refs.nv) return;
  refs.nv.hb.dataset.state = e.state==="done"?"done" : e.state==="boom"?"boom" : "idle";
  refs.nv.hl.textContent = e.state==="done"?"확정!" : e.state==="boom"?"💥 터졌다"
                         : e.state==="wait"?"결과 확인 중" : "누르고 있기";
  refs.nv.hs.textContent = fmt(e.held||0)+"초 버팀";
  refs.nv.sc.textContent = e.score!=null?e.score:0;
  refs.nv.scu.textContent="점";
}
function vNerve(){
  keepAwake(true);
  const m=ST;
  stage.innerHTML=
      '<div class="eyebrow">'+(m.rematch?m.rematch+"차 재대결 · ":"")+m.roster.length+'명 동시 진행</div>'+
      '<h2 class="title" style="margin-top:-8px">같은 폭탄, 같은 출발</h2>'+
      '<div class="deadline"><i id="bar"></i></div>'+
      '<div class="bigtime"><span id="sc">0</span><span class="u" id="scu">점</span></div>'+
      '<div class="holdwrap"><div class="hold" id="hb" data-state="idle" role="button" tabindex="0">'+
      '<span class="hl" id="hl">누르고 있기</span><span class="hs" id="hs">0.00초</span></div></div>'+
      '<div class="panel"><ul class="rulelist">'+
      '<li>카운트다운이 끝나면 <b>전원 동시에</b> 출발합니다. 미리 눌러 두고 기다려도 됩니다.</li>'+
      '<li>폭탄 시간은 <span class="cool">이번 라운드 참가자 전원이 똑같습니다.</span> 2.5~10.5초 사이.</li>'+
      '<li>터지기 전에 손을 떼면 버틴 만큼 점수, <span class="hot">터질 때까지 잡고 있으면 0점.</span></li>'+
      '<li>최저 점수가 삽니다. 동점이면 그 사람들끼리 재대결.</li></ul></div>'+
      '<div class="note" id="nn"></div>';
  refs.nv={hb:$("#hb"),hl:$("#hl"),hs:$("#hs"),sc:$("#sc"),scu:$("#scu"),bar:$("#bar"),nn:$("#nn")};
  if(nv.key!==m.roundKey){
    nv.key=m.roundKey; nv.pressAt=0; nv.goLocal=0;
    nv.holding=false; nv.fin=false; nv.sentHold=false; nv.painted="";
  }
  const mine=m.entries[ME.id];
  if(mine&&(mine.state==="done"||mine.state==="boom")){ nv.fin=true; nv.painted=mine.state; paintNv(mine); }
  else if(nv.holding) paintHolding();

  const hb=refs.nv.hb;
  const down=ev=>{
    if(ev) ev.preventDefault();
    if(nv.fin||nv.holding) return;
    if(ST.stage!=="count"&&ST.stage!=="hold") return;
    nv.holding=true; nv.pressAt=Date.now(); buzz(18);
    sendHold(); paintHolding(); loop();
  };
  const up=()=>{
    if(!nv.holding||nv.fin) return;
    nv.holding=false; cancelAnimationFrame(nv.raf);
    if(!nv.goLocal){                       // 출발 전에 뗀 것은 무효 — 다시 누를 수 있다
      nv.pressAt=0; refs.nv.hb.dataset.state="idle";
      refs.nv.hl.textContent="누르고 있기"; refs.nv.hs.textContent="곧 시작";
      return;
    }
    const held=Math.round(heldNow());
    nv.fin=true;
    netSend({t:"nerve", state:"release", held});
    paintNv({state:"wait", score:Math.round(held/10), held});   // 폭발 여부는 방장이 판정
  };
  function loop(){
    if(!nv.holding||!refs.nv){ nv.holding=false; return; }   // 판이 바뀌면 루프도 멈춘다
    if(nv.goLocal){
      const held=heldNow();
      refs.nv.sc.textContent=Math.round(held/10);
      refs.nv.hs.textContent=fmt(held)+"초";
    }
    nv.raf=requestAnimationFrame(loop);
  }
  hb.addEventListener("pointerdown",down);
  hb.addEventListener("pointerup",up);
  hb.addEventListener("pointercancel",up);
  hb.addEventListener("pointerleave",up);
  hb.addEventListener("keydown",e=>{ if((e.key===" "||e.key==="Enter")&&!e.repeat) down(e); });
  hb.addEventListener("keyup",e=>{ if(e.key===" "||e.key==="Enter") up(); });
  if(nv.holding) loop();
}

  stage.innerHTML=

const roul={key:"",applied:false};
function drawWheel(cv,labels){
  const size=cv.clientWidth||280; if(!size||!labels.length) return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(size*dpr); cv.height=Math.round(size*dpr);
  const g=cv.getContext("2d"); if(!g) return;
  g.setTransform(dpr,0,0,dpr,0,0);
  const R=size/2, n=labels.length, slice=(Math.PI*2)/n;
  g.clearRect(0,0,size,size);
  labels.forEach((label,i)=>{
    const a0=-Math.PI/2+i*slice;
    let ci=i%WHEEL_COLORS.length;
    if(n>1&&i===n-1&&ci===0) ci=1;                     // 첫 칸과 맞닿는 색이 겹치지 않게
    g.beginPath(); g.moveTo(R,R); g.arc(R,R,R-2,a0,a0+slice); g.closePath();
    g.fillStyle=WHEEL_COLORS[ci]; g.fill();
    g.strokeStyle="rgba(23,19,14,.55)"; g.lineWidth=1.5; g.stroke();
    g.save(); g.translate(R,R); g.rotate(a0+slice/2);
    g.fillStyle="#17130E"; g.textAlign="right"; g.textBaseline="middle";
    g.font="700 "+Math.max(10,Math.min(15,150/n+7))+"px 'IBM Plex Sans KR',sans-serif";
    let t=String(label);
    while(t.length>1&&g.measureText(t).width>R*0.6) t=t.slice(0,-1);
    g.fillText(t,R-14,0);
    g.restore();
  });
}
function applySpin(r,animate){
  const m=ST;
  if(!r||!r.cv||!m||m.stage!=="spin"||!m.spin) return;
  if(roul.applied) return;
  roul.applied=true;
  if(!animate){ r.cv.style.transition="none"; r.cv.style.transform="rotate("+m.spin.deg+"deg)"; return; }
  r.cv.style.transition="";
  void r.cv.offsetHeight;                              // 리플로우 후 트랜지션 시작
  r.cv.style.transform="rotate("+m.spin.deg+"deg)";
  buzz([20,60,20,60,20]);
}

/* ---- 반응속도 테스트 ----
   측정 횟수는 방장이 정하고, 순위는 평균이 아니라 그 사람의 가장 빠른 한 번(베스트)으로 낸다.
   초록불 전에 누르면 그 회차는 기록 없이 소멸(꽝)하므로, 성급할수록 좋은 기록을 낼 기회가 줄어든다. */
const rt={key:"",state:"idle",times:[],last:0,best:null,goAt:0,to:0,done:false};
const rtN=()=>(ST&&ST.trials)||REACT_TRIALS;
function drawTrials(){
  const r=refs.react; if(!r) return;
  r.tr.innerHTML="";
  for(let i=0;i<rtN();i++){
    const d=document.createElement("span"), v=rt.times[i], used=i<rt.times.length;
    d.className="trial"+(v!=null?" on":(used?" bad":""));
    d.textContent=(i+1)+"회 "+(v!=null?v+"ms":(used?"꽝":"–"));
    r.tr.appendChild(d);
  }
}
function paintReact(){
  const r=refs.react; if(!r) return;
  r.pad.dataset.s=rt.state;
  const n=rt.times.length, N=rtN();
  if(rt.state==="idle"){ r.pl.textContent=n?"탭해서 다음 회차":"탭해서 시작"; r.ps.textContent=n+" / "+N+" 완료"; }
  else if(rt.state==="wait"){ r.pl.textContent="기다리세요"; r.ps.textContent="초록색이 되면 바로 탭"; }
  else if(rt.state==="go"){ r.pl.textContent="지금!"; r.ps.textContent=""; }
  else if(rt.state==="early"){ r.pl.textContent="꽝!"; r.ps.textContent="초록불 전에 눌렀어요 · 이 회차는 소멸 · "+n+" / "+N; }
  else if(rt.state==="res"){ r.pl.textContent=rt.last+"ms"; r.ps.textContent=n+" / "+N+" · 탭해서 다음 회차"; }
  else if(rt.state==="done"){
    r.pl.textContent=rt.best!=null?rt.best+"ms":"전부 꽝";
    r.ps.textContent=(rt.best!=null?"내 최고 기록 · ":"")+"다른 사람을 기다리는 중";
  }
}
function reactFinish(){
  const nums=rt.times.filter(v=>v!=null);
  rt.best=nums.length?Math.min.apply(null,nums):null;
  rt.done=true; rt.state="done"; paintReact();
  netSend({t:"react", done:true, best:rt.best==null?99999:rt.best,
           fails:rt.times.filter(v=>v==null).length});
}
function reactTap(){
  if(rt.done||!ST||ST.phase!=="play"||ST.game!=="react") return;
  if(rt.state==="idle"||rt.state==="early"||rt.state==="res"){
    if(rt.times.length>=rtN()) return;
    rt.state="wait"; paintReact();
    clearTimeout(rt.to);
    rt.to=setTimeout(()=>{
      if(rt.state!=="wait"||!ST||ST.game!=="react") return;
      rt.state="go"; rt.goAt=Date.now(); paintReact(); buzz(15);
    }, REACT_MIN+Math.random()*(REACT_MAX-REACT_MIN));
    return;
  }
  if(rt.state==="wait"){                     // 초록불 전에 누름 → 꽝, 이 회차 소멸
    clearTimeout(rt.to);
    rt.times.push(null); drawTrials(); buzz([60,50,60]);
    if(rt.times.length>=rtN()) return reactFinish();
    rt.state="early"; paintReact();
    netSend({t:"react", n:rt.times.length});
    return;
  }
  if(rt.state==="go"){
    rt.last=Date.now()-rt.goAt; rt.times.push(rt.last);
    drawTrials(); buzz(15);
    if(rt.times.length>=rtN()) return reactFinish();
    rt.state="res"; paintReact();
    netSend({t:"react", n:rt.times.length});
  }
}

  keepAwake(true);
  const m=ST;
  stage.innerHTML=

    '<li>'+rtN()+'회 중 <b>가장 빠른 한 번</b>이 내 기록. 그게 가장 느린 사람이 삽니다.</li>'+

    '</ul></div><div class="note" id="rn2"></div>';
  refs.react={pad:$("#pad"),pl:$("#pl"),ps:$("#ps"),tr:$("#tr"),rn:$("#rn2")};
  if(rt.key!==m.roundKey){
    clearTimeout(rt.to);
    rt.key=m.roundKey; rt.state="idle"; rt.times=[]; rt.last=0; rt.best=null; rt.done=false;

/* ---- 야바위 ---- */
/* 컵 위치는 매 프레임 직접 계산한다. 두 컵이 서로 반대 방향으로 호를 그리며 지나가고
   앞으로 지나가는 쪽은 살짝 커지면서 위로 떠서, 평면 슬라이드보다 훨씬 따라가기 쉽다. */
const shell={key:"",applied:0,goLocal:0,stage:"",raf:0,mv:null,
             cupSlot:[0,1,2], cupAtSlot:[0,1,2]};
// 컵 폭(21%) 기준 한 자리 간격. 자리 0·1·2 가 화면의 8% / 39.5% / 71% 에 놓인다.
const CUP_PITCH=150;
function drawCups(){
  const r=refs.shell; if(!r) return;
  const now=performance.now(), mv=shell.mv;
  for(let c=0;c<3;c++){
    let from=shell.cupSlot[c], to=from, p=0, dir=0, amp=1;
    const m=mv&&mv.m[c];
    if(m){
      from=m.from; to=m.to; dir=m.dir; amp=m.amp;
      p=clamp((now-mv.t0)/mv.dur,0,1);
    }
    const ease=0.5-0.5*Math.cos(Math.PI*p);
    const arc=Math.sin(Math.PI*p)*amp;
    const x=(from+(to-from)*ease)*CUP_PITCH;
    const e=r.cups[c];
    e.style.zIndex = dir>0?"3" : dir<0?"1" : "2";
    e.style.transform=
      "translateX("+x.toFixed(2)+"%) "+
      "translateY("+(dir? (dir>0?-1:1)*arc*(dir>0?22:9) : 0).toFixed(1)+"px) "+
      "scale("+(dir? 1+arc*(dir>0?0.10:-0.09) : 1).toFixed(3)+") "+
      "rotate("+(dir? -dir*arc*6 : 0).toFixed(1)+"deg)";
  }
}
function shellFrame(){
  if(!refs.shell||!ST||ST.game!=="shell"){ shell.raf=0; return; }
  drawCups();
  shell.raf=requestAnimationFrame(shellFrame);
}
function vShell(){
  keepAwake(true);
  const m=ST;
  stage.innerHTML=
    '<div class="eyebrow">'+m.shellRound+'라운드 · 남은 인원 '+m.alive.length+'명</div>'+
    '<h2 class="title" style="margin-top:-8px">공이 든 컵을 끝까지</h2>'+
    '<div class="deadline"><i id="bar"></i></div>'+
    '<div class="cups" id="cups">'+
      [0,1,2].map(i=>'<button class="cup" data-c="'+i+'"></button>').join("")+
      '<div class="ball hidden" id="ball">⚫</div></div>'+
    '<div class="slotlab"><span>1번</span><span>2번</span><span>3번</span></div>'+
    '<div class="cstat" id="ss"></div>'+
    '<div class="panel"><ul class="rulelist">'+
    '<li>처음 <b>1.3초</b> 동안만 공이 어느 컵에 있는지 보여줍니다.</li>'+
    '<li><span class="hot">15초</span> 동안 섞입니다. 뒤로 갈수록 빨라지고, '+
      '<span class="hot">세 컵이 한꺼번에 도는 수</span>도 잦아집니다.</li>'+
    '<li>섞임이 끝나면 컵을 눌러 고르세요. 모두 <span class="cool">같은 화면</span>을 봅니다.</li>'+
    '<li>맞히면 탈출, 틀리거나 못 고르면 다음 라운드로. 마지막 한 명이 삽니다.</li></ul></div>'+
    '<div class="note" id="sn"></div>';
  refs.shell={cups:[...stage.querySelectorAll(".cup")], ball:$("#ball"),
              ss:$("#ss"), sn:$("#sn"), bar:$("#bar"), shown:""};
  if(shell.key!==m.roundKey){
    shell.key=m.roundKey; shell.applied=0; shell.goLocal=0; shell.stage=""; shell.mv=null;
    shell.cupSlot=[0,1,2]; shell.cupAtSlot=[0,1,2];
  }
  refs.shell.cups.forEach((e,i)=>{
    e.onclick=()=>{
      if(ST.stage!=="pick") return;
      if((ST.entries[ME.id]||{}).submitted) return;
      netSend({t:"shell", cup:shell.cupSlot[i]}); buzz(18);
    };
  });
  paintShell(); drawCups();
  if(!shell.raf) shell.raf=requestAnimationFrame(shellFrame);
}
function paintShell(){
  const m=ST, r=refs.shell; if(!r||!m||!m.shell) return;
  const st=m.stage;
  if(shell.stage!==st){                       // 단계가 바뀔 때마다 기준시각을 새로 잡는다
    shell.stage=st; shell.goLocal=Date.now();
    if(st==="shuffle"){
      shell.applied=0; shell.mv=null;
      shell.cupSlot=[0,1,2]; shell.cupAtSlot=[0,1,2];
    }
    r.shown="";
  }
  if(st==="peek"){
    r.ball.classList.remove("hidden");
    r.ball.style.transform="translateX("+(m.shell.pos0*CUP_PITCH).toFixed(3)+"%)";
    r.cups.forEach(e=>e.classList.add("up"));
    r.ss.className="cstat chk"; r.ss.textContent="공은 "+(m.shell.pos0+1)+"번 컵에 있습니다";
    r.sn.textContent="잘 보세요…";
    return;
  }
  if(st==="shuffle"){
    r.ball.classList.add("hidden");
    r.cups.forEach(e=>e.classList.remove("up"));
    const el=Date.now()-shell.goLocal, seq=m.shell.seq;
    let t=0,k=0;
    while(k<seq.length && t<=el){ t+=seq[k].d; k++; }
    while(shell.applied<k && shell.applied<seq.length){
      const s=seq[shell.applied];
      const prev=shell.cupAtSlot.slice();     // prev[자리] = 그 자리에 있던 컵
      const mvm={};
      for(let slot=0;slot<3;slot++){
        const cup=prev[slot], to=s.p[slot];
        shell.cupAtSlot[to]=cup; shell.cupSlot[cup]=to;
        if(to!==slot){
          mvm[cup]={from:slot, to,
            dir:(to>slot?1:-1)*(s.f?-1:1),
            amp:Math.abs(to-slot)>1?1.4:1};   // 멀리 가는 컵은 더 크게 호를 그린다
        }
      }
      shell.mv={t0:performance.now(), dur:s.d, m:mvm};
      shell.applied++;
    }
    r.ss.className="cstat"; r.ss.textContent="섞는 중…";
    r.sn.textContent="남은 시간 "+Math.ceil(getRemain()/1000)+"초";
    return;
  }
  const mine=m.entries[ME.id]||{};
  const key=mine.submitted?"s":"p";
  if(r.shown!==key){
    r.shown=key;
    r.cups.forEach(e=>e.classList.toggle("pickable",!mine.submitted));
    r.ss.className="cstat "+(mine.submitted?"ok":"chk");
    r.ss.textContent=mine.submitted?"✅ 제출 완료 · 기다리는 중":"컵을 골라 주세요";
  }
  const done=m.alive.filter(id=>m.entries[id]&&m.entries[id].submitted).length;
  r.sn.textContent="남은 시간 "+Math.ceil(getRemain()/1000)+"초 · "+done+"/"+m.alive.length+"명 선택";
}

/* ---- 과녁 맞추기 ---- */
const aim={key:"",goLocal:0,score:0,hits:0,done:false,hit:{},map:{},free:[]};
function aimFlash(x,y,txt,good){
  const f=refs.aim&&refs.aim.flash; if(!f) return;
  f.style.left=x+"%"; f.style.top=y+"%";
  f.textContent=txt;
  f.className="aflash "+(good?"good":"bad");
  void f.offsetWidth;                       // 리플로우로 애니메이션을 다시 시작
  f.classList.add("go");
}
function vAim(){
  keepAwake(true);
  const m=ST;
  stage.innerHTML=
    '<div class="eyebrow">과녁 맞추기 · '+m.roster.length+'명 · 15초</div>'+
    '<h2 class="title" style="margin-top:-8px">뜨는 즉시 누르세요</h2>'+
    '<div class="deadline"><i id="bar"></i></div>'+
    '<div class="aimhud"><span class="as" id="ascore">0</span><span class="au">점</span>'+
    '<span class="ah" id="ahits">0개</span></div>'+
    '<div class="aimarea" id="aa">'+
      Array.from({length:AIM_POOL},(_,p)=>'<div class="tgt" data-p="'+p+'" data-on="0" data-idx="-1">🎯</div>').join("")+
      '<div class="aflash" id="af"></div></div>'+
    '<div class="panel" id="arules"><ul class="rulelist">'+
    '<li>과녁이 <b>완전히 무작위인 자리</b>에 떴다가 잠시 뒤 사라집니다.</li>'+
    '<li><span class="cool">빨리 누를수록 높은 점수</span> — 막 떴을 때 100점, 사라질 때쯤 10점.</li>'+
    '<li>빈 곳을 누르면 <span class="hot">-15점</span>이니 마구 두드리면 손해입니다.</li>'+
    '<li>모두 같은 순서로 진행하고, 점수가 가장 낮은 사람이 삽니다.</li></ul></div>'+
    '<div class="note" id="an"></div>';
  refs.aim={area:$("#aa"), pool:[...stage.querySelectorAll(".tgt")], flash:$("#af"),
            sc:$("#ascore"), hi:$("#ahits"), bar:$("#bar"), an:$("#an"),
            rules:$("#arules"), locked:false};
  // touch-action 만으로 안 잡히는 기기가 있어 끌기 자체를 막아 둔다
  refs.aim.area.addEventListener("touchmove",ev=>ev.preventDefault(),{passive:false});
  if(aim.key!==m.roundKey){
    aim.key=m.roundKey; aim.goLocal=0; aim.score=0; aim.hits=0; aim.done=false;
    aim.hit={}; aim.map={};
  }
  aim.free=[]; for(let p=AIM_POOL-1;p>=0;p--) aim.free.push(p);
  aim.map={};
  const live=()=>!(aim.done||ST.stage!=="run"||!aim.goLocal);
  // click 은 탭이 끝날 때까지 기다리고 손가락이 살짝 움직이면 취소돼 '씹히는' 느낌이 난다.
  // pointerdown 으로 누르는 즉시 판정한다.
  refs.aim.pool.forEach(el=>{
    el.addEventListener("pointerdown",ev=>{
      ev.preventDefault(); ev.stopPropagation();
      if(!live()) return;
      const idx=parseInt(el.dataset.idx||"-1",10);
      if(idx<0||aim.hit[idx]) return;
      aim.hit[idx]=true;
      const s=ST.aim.seq[idx], t=Date.now()-aim.goLocal;
      const p=Math.max(10,Math.round(100*(1-clamp((t-s.t)/s.life,0,1))));
      aim.score+=p; aim.hits++; buzz(12);
      aimFlash(s.x,s.y,"+"+p,true);
      paintAimHud(); paintAim();
    });
  });
  refs.aim.area.addEventListener("pointerdown",ev=>{   // 빈 곳을 눌렀을 때
    if(!live()) return;
    ev.preventDefault();
    const b=refs.aim.area.getBoundingClientRect();
    const x=clamp((ev.clientX-b.left)/b.width*100,3,97);
    const y=clamp((ev.clientY-b.top)/b.height*100,3,97);
    aim.score-=15; buzz(22);
    aimFlash(x,y,"-15",false);
    paintAimHud();
  });
  paintAimHud(); paintAim();
}
function paintAimHud(){
  const r=refs.aim; if(!r) return;
  r.sc.textContent=aim.score; r.hi.textContent=aim.hits+"개";
}
function aimRelease(p){
  const el=refs.aim.pool[p];
  el.dataset.on="0"; el.dataset.idx="-1";
  if(aim.free.indexOf(p)<0) aim.free.push(p);
}
function paintAim(){
  const m=ST, r=refs.aim; if(!r||!m||!m.aim) return;
  if(m.stage==="count"){
    r.an.textContent="곧 시작합니다 · "+Math.max(1,Math.ceil(getRemain()/1000));
    return;
  }
  if(!r.locked){                 // 진행이 시작되면 규칙을 접고 화면을 맨 위로 고정한다
    r.locked=true;
    if(r.rules) r.rules.classList.add("hidden");
    try{ window.scrollTo(0,0); }catch(e){}
    document.body.classList.add("noscroll");
  }
  if(!aim.goLocal) aim.goLocal=Date.now();
  const el=Date.now()-aim.goLocal, seq=m.aim.seq;
  const act={};
  for(let i=0;i<seq.length;i++){
    const s=seq[i];
    if(s.t>el) break;
    if(el<s.t+s.life && !aim.hit[i]) act[i]=true;
  }
  for(const k in aim.map){                   // 사라진 과녁 정리
    if(!act[k]){ aimRelease(aim.map[k]); delete aim.map[k]; }
  }
  for(const k in act){                       // 새로 뜬 과녁 배치
    if(aim.map[k]!=null) continue;
    const p=aim.free.pop(); if(p==null) continue;
    aim.map[k]=p;
    const s=seq[k], e=r.pool[p];
    e.style.left=s.x+"%"; e.style.top=s.y+"%";
    e.dataset.idx=String(k); e.dataset.on="1";
  }
  r.an.textContent="남은 시간 "+(Math.max(0,AIM_MS-el)/1000).toFixed(1)+"초";
  if(el>=AIM_MS && !aim.done){
    aim.done=true;
    for(const k in aim.map){ aimRelease(aim.map[k]); delete aim.map[k]; }
    document.body.classList.remove("noscroll");      // 끝나면 다시 스크롤 가능
    r.an.textContent="끝! "+aim.score+"점 · 다른 사람을 기다리는 중";
    netSend({t:"aim", score:aim.score, hits:aim.hits});
  }
}
