      '<span class="big">'+(m.cpu!=null?RPS[m.cpu].e:"❓")+'</span>'+
      '<span class="nm2">'+(m.cpu!=null?esc(RPS[m.cpu].n):"")+'</span></div>'+
      '<div class="revealgrid">'+(m.board||[]).map(b=>{
        const cls=b.hand==null?"rv miss":(b.win?"rv uniq":"rv stay");
        return '<span class="'+cls+'"><span>'+esc(emojiOf(b.id))+'</span><span>'+esc(nameOf(b.id))+'</span>'+
          '<span class="num">'+(b.hand==null?"–":RPS[b.hand].e)+'</span>'+
          '<span class="tg">'+(b.tag?esc(b.tag):(b.hand==null?"미제출":(b.win?"탈출":"잔류")))+'</span></span>';
      }).join("")+'</div>'
    : '<div class="revealgrid">'+(m.board||[]).map(b=>{
        const cls=b.num==null?"rv miss":(b.unique?"rv uniq":"rv stay");
        return '<span class="'+cls+'"><span>'+esc(emojiOf(b.id))+'</span><span>'+esc(nameOf(b.id))+'</span>'+
          '<span class="num">'+(b.num==null?"–":b.num)+'</span>'+
          '<span class="tg">'+(b.num==null?"미제출":(b.unique?"탈출":"잔류"))+'</span></span>';
      }).join("")+'</div>';
  stage.innerHTML='<div class="eyebrow">'+esc(m.note||"공개")+'</div>'+
    '<h2 class="title" style="margin-top:-8px">'+
      (m.game==="nerve"?"점수 공개":m.game==="rps"||m.game==="shell"?"결과 공개":"숫자 공개")+'</h2>'+
    body+'<div class="panel center"><span class="lead">다음 라운드까지 '+
    '<b id="rc" style="color:var(--amber);font-family:var(--mono)">6</b>초</span></div>';
  refs.rc=$("#rc");
}

/* ---- 결과 ---- */
function boardHTML(board,loser){
  if(!board||!board.length) return "";
  return '<div class="board">'+board.map((b,i)=>{
    const isL=b.loser||b.id===loser;
    const right=b.label!=null?esc(b.label):(b.score!=null?b.score+"점":"");
    const tag=b.state==="boom"?'<span class="tag">💥 '+fmt(b.held)+'초</span>'
      :b.state==="miss"?'<span class="tag">미참여</span>'
      :b.held!=null?'<span class="tag">'+fmt(b.held)+'초</span>':'';
    return '<div class="brow'+(isL?" loser":(i===0&&b.score!=null?" top":""))+'">'+
      '<span class="rk">'+(i+1)+'</span><span>'+esc(emojiOf(b.id))+'</span>'+
      '<span>'+esc(nameOf(b.id))+' '+tag+'</span><span class="sc">'+right+'</span></div>';
  }).join("")+'</div>';
}
function vResult(){
  keepAwake(false);
  const m=ST,L=m.loser;
  if(m.game==="cafe"){
    const isHost=(ME.id===m.hostId);
    stage.innerHTML=
      '<div class="verdict good"><div class="face">🏪</div>'+
      '<div class="who">오늘의 카페는<br><span>'+esc(m.cafePick||"")+'</span></div>'+
      '<div class="sub">'+esc(m.note||"")+'</div></div>'+
      '<div class="plist">'+(m.cafes||[]).map(c=>
        '<div class="pchip'+(c===m.cafePick?" hit":"")+'"><span>'+esc(c)+'</span></div>').join("")+'</div>'+
      (isHost?'<div class="btnrow"><button class="btn ghost" id="again">다시 뽑기</button>'+
        '<button class="btn" id="other">게임 고르기</button></div>'
        :'<div class="panel center"><span class="lead">방장이 다음을 고르는 중이에요</span></div>');
    if(isHost){
      $("#again").onclick=()=>netSend({t:"start",game:"cafe",cafes:m.cafes});
      $("#other").onclick=()=>netSend({t:"lobby"});
    }
    return;
  }
  stage.innerHTML=
    '<div class="verdict"><div class="face">'+esc(emojiOf(L))+'</div>'+
    '<div class="who">오늘 커피는<br><span>'+esc(nameOf(L))+'</span>님이 쏩니다</div>'+
    '<div class="sub">'+esc(GAMES[m.game]?GAMES[m.game].name:"")+(m.note?" · "+esc(m.note):"")+'</div></div>'+
    boardHTML(m.board||[],L)+
    (ME.id===m.hostId
      ? '<div class="btnrow"><button class="btn ghost" id="again">한 판 더</button>'+
        '<button class="btn" id="other">다른 게임</button></div>'
      : '<div class="panel center"><span class="lead">방장이 다음 게임을 고르는 중이에요</span></div>');
  if(ME.id===m.hostId){
    $("#again").onclick=()=>netSend({t:"start",game:m.game,trials:m.trials||reactN});
    $("#other").onclick=()=>netSend({t:"lobby"});
  }
}

/* ---- 프레임 갱신 ---- */
function patch(){
  const m=ST; if(!m) return;
  if(refs.ln){
    const on=m.order.filter(id=>m.players[id].on);
    const play=on.filter(id=>!m.players[id].spec).length;
    refs.ln.textContent = on.length<2 ? "혼자 있어요 · 지금 시작하면 연습 모드로 돌아갑니다"
      : on.length+"명 접속 · "+play+"명 참가"+(on.length-play?" · "+(on.length-play)+"명 관전":"");
  }
  if(refs.lob) paintLobbyList();
  if(refs.nv&&m.phase==="play"&&m.game==="nerve"){
    const counting=(m.stage==="count");
    if(!counting&&!nv.goLocal){                 // 출발 신호를 처음 본 순간이 내 기준시각
      nv.goLocal=Date.now();
      refs.nv.sc.textContent="0"; refs.nv.hs.textContent="0.00초";
      if(nv.holding){ sendHold(); paintHolding(); }
    }
    const left=getRemain();
    if(counting){
      refs.nv.bar.style.width=(left/NV_COUNT*100)+"%";
      refs.nv.bar.parentNode.classList.remove("warn");
      refs.nv.sc.textContent=Math.max(1,Math.ceil(left/1000));
      refs.nv.scu.textContent="";
      refs.nv.nn.textContent=nv.holding?"준비 완료 · 출발 신호를 기다리는 중":"미리 눌러 두고 기다려도 됩니다";
      if(!nv.holding){ refs.nv.hl.textContent="누르고 있기"; refs.nv.hs.textContent="곧 시작"; }
    }else{
      refs.nv.bar.style.width="100%";
      refs.nv.bar.parentNode.classList.add("warn");
      refs.nv.scu.textContent="점";
      refs.nv.nn.textContent="전원 동시 진행 중 · 남의 기록은 끝나고 한꺼번에 공개됩니다";
    }
    if(m.boom&&nv.holding&&!nv.fin){            // 전원 동시 폭발
      const held=Math.round(heldNow());
      nv.holding=false; nv.fin=true; cancelAnimationFrame(nv.raf); buzz([50,40,90]);
      nv.painted="boom"; paintNv({state:"boom",score:0,held});
    }
    const e=m.entries[ME.id];                   // 방장 판정이 오면 그대로 반영
    if(e&&(e.state==="done"||e.state==="boom")&&nv.painted!==e.state){
      nv.painted=e.state; nv.fin=true; nv.holding=false; cancelAnimationFrame(nv.raf); paintNv(e);
    }
  }
  if(refs.bomb&&m.phase==="play"&&m.game==="bomb"){
    const isH=m.holder===ME.id;
    refs.bomb.line.innerHTML=isH?'<em>당신</em>이 들고 있습니다'
      :esc(emojiOf(m.holder))+' <em>'+esc(nameOf(m.holder))+'</em>님이 들고 있습니다';
    refs.bomb.bn.textContent=(m.passes||0)+"번 돌았습니다";
    if(refs.bomb.pg&&refs.bomb.pg.children.length){
      [...refs.bomb.pg.children].forEach(b=>{
        const id=b.dataset.id; if(!id) return;
        b.disabled=(id===m.from)||!(m.players[id]&&m.players[id].on);
      });
    }
  }
  if(refs.uni&&m.phase==="play"&&m.game==="unique"){
    const left=getRemain();
    refs.uni.bar.style.width=(left/UNI_LIMIT*100)+"%";
    refs.uni.bar.parentNode.classList.toggle("warn",left<8000);
    const done=m.alive.filter(id=>m.entries[id]&&m.entries[id].submitted).length;
    refs.uni.un.textContent="남은 시간 "+Math.ceil(left/1000)+"초 · "+done+"/"+m.alive.length+"명 제출";
  }
  if(refs.cafe&&m.phase==="play"&&m.game==="cafe"){
    if(m.stage==="spin") applySpin(refs.cafe,true);
    paintCafe();
  }
  if(refs.roul&&m.phase==="play"&&m.game==="roul"){
    const spinning=(m.stage==="spin");
    if(spinning) applySpin(refs.roul,true);
    if(refs.roul.btn){ refs.roul.btn.disabled=spinning; refs.roul.btn.textContent=spinning?"도는 중…":"돌리기"; }
    if(refs.roul.rs) refs.roul.rs.textContent=spinning?"룰렛이 돌아가는 중…":"방장이 돌릴 때까지 기다려 주세요";
    refs.roul.rn.textContent=m.roster.length+"칸 · 접속한 인원으로 자동 생성";
  }
  if(refs.react&&m.phase==="play"&&m.game==="react"){
    const fin=m.roster.filter(id=>m.entries[id]&&m.entries[id].done).length;
    refs.react.rn.textContent="남은 시간 "+Math.ceil(getRemain()/1000)+"초 · "+fin+"/"+m.roster.length+"명 완료";
  }
  if(refs.rps&&m.phase==="play"&&m.game==="rps"){
    const left=getRemain();
    refs.rps.bar.style.width=(left/RPS_LIMIT*100)+"%";
    refs.rps.bar.parentNode.classList.toggle("warn",left<6000);
    const done=m.alive.filter(id=>m.entries[id]&&m.entries[id].submitted).length;
    refs.rps.rn.textContent="남은 시간 "+Math.ceil(left/1000)+"초 · "+done+"/"+m.alive.length+"명 제출";
  }
  if(refs.cho&&m.phase==="play"&&m.game==="cho"){
    const left=getRemain(), counting=(m.stage==="count");
    refs.cho.bar.style.width=(left/(counting?NV_COUNT:CHO_LIMIT)*100)+"%";
    refs.cho.bar.parentNode.classList.toggle("warn",!counting&&left<15000);
    if(counting) refs.cho.cn.textContent="모두 같은 순간에 초성이 공개됩니다";
    else{
      const done=m.roster.filter(id=>m.entries[id]&&m.entries[id].ok).length;
      refs.cho.cn.textContent="남은 시간 "+Math.ceil(left/1000)+"초 · "+done+"/"+m.roster.length+"명 성공";
    }
    paintCho();
  }
  if(refs.shell&&m.phase==="play"&&m.game==="shell"){
    const span = m.stage==="peek"?SHELL_PEEK : m.stage==="shuffle"?SHELL_MS : SHELL_PICK;
    refs.shell.bar.style.width=(getRemain()/span*100)+"%";
    refs.shell.bar.parentNode.classList.toggle("warn",m.stage==="pick");
    paintShell();
  }
  if(refs.aim&&m.phase==="play"&&m.game==="aim"){
    const counting=(m.stage==="count");
    refs.aim.bar.style.width=(getRemain()/(counting?AIM_COUNT:AIM_MS)*100)+"%";
    refs.aim.bar.parentNode.classList.toggle("warn",!counting);
    paintAim();
  }
  if(refs.pick&&m.phase==="picking") paintPicking();
  if(refs.rc&&m.phase==="reveal") refs.rc.textContent=Math.max(0,Math.ceil(getRemain()/1000));
}

/* ---- 참가자 칩 ---- */
let rk="";
function renderRoster(){
  if(!ST||!Net.role){ rosterEl.innerHTML=""; rk=""; return; }
  const m=ST;
  let ids = (m.phase==="play"&&(m.game==="unique"||m.game==="rps"||m.game==="shell")) ? m.alive.slice()
          : (m.phase==="play") ? m.roster.slice()
          : m.order.filter(id=>m.players[id].on);
  const key=ids.join(",")+"|"+m.phase+m.game+m.holder+m.roundKey;
  if(key!==rk){
    rk=key; rosterEl.innerHTML="";
    ids.forEach(id=>{
      const c=document.createElement("div"); c.dataset.id=id;
      c.innerHTML='<span>'+esc(emojiOf(id))+'</span><span class="cn">'+esc(nameOf(id))+'</span><span class="cs"></span>';
      rosterEl.appendChild(c);
    });
  }
  [...rosterEl.children].forEach(c=>{
    const id=c.dataset.id, cs=c.querySelector(".cs");
    const p=m.players[id]||{};
    c.className="chip"+(id===ME.id?" me":"")+(id===m.hostId?" host":"")+(p.on?"":" dead")+
      (p.spec&&m.phase==="lobby"?" spec":"");
    let t="";
    if(m.phase==="play"&&m.game==="nerve"){
      // 남의 진행 상태는 감춘다. 점수나 '버티는 중'이 보이면 일부러 늦게 눌러
      // 최저 점수만 넘기는 식으로 위험을 피할 수 있어서다. 결과 화면에서 한꺼번에 공개된다.
      t="";
    }else if(m.phase==="play"&&m.game==="bomb"){
      if(id===m.holder){ t="💣"; c.className+=" holder"; }
    }else if(m.phase==="play"&&m.game==="aim"){
      const e=m.entries[id];
      if(e&&e.done){ t=e.score+"점"; c.className+=" safe"; } else t="…";
    }else if(m.phase==="play"&&(m.game==="unique"||m.game==="rps"||m.game==="shell")){
      const e=m.entries[id];
      t=(e&&e.submitted)?"✓":"…";
      if(e&&e.submitted) c.className+=" safe";
    }else if(m.phase==="play"&&m.game==="cho"){
      const e=m.entries[id];
      if(e&&e.ok){ t="✓"; c.className+=" safe"; }
      else if(e&&e.checking) t="⏳";
      else t="…";
    }else if(m.phase==="play"&&m.game==="react"){
      const e=m.entries[id];
      if(e&&e.done){ t=e.best<99999?e.best+"ms":"꽝"; c.className+=(e.best<99999?" safe":" hot"); }
      else t=((e&&e.n)||0)+"/"+m.trials;
    }
    cs.textContent=t;
  });
}

/* ================= 시작 ================= */
if(typeof Peer==="undefined"){
  stage.innerHTML='<div class="panel center" style="margin-top:40px"><div style="font-size:32px">📡</div>'+
    '<h2 class="title" style="margin-top:8px">통신 모듈을 불러오지 못했어요</h2>'+
    '<p class="lead" style="margin-top:8px">네트워크를 확인하고 새로고침해 주세요.</p></div>';
}else{
  setInterval(hostTick,100);
  setInterval(()=>patch(),100);
  $("#meChip").onclick=()=>{
    if(Net.role) return;                       // 방에 들어간 뒤에는 바꿀 수 없다
    editMode=true; viewKey=""; render();
  };
  $("#abort").onclick=()=>{
    if(!ST||Net.role!=="host"||ST.phase==="lobby") return;
    if(confirm("진행 중인 게임을 중단하고 게임 선택으로 돌아갈까요?")) netSend({t:"lobby"});
  };
  const h=(location.hash||"").replace("#","").toUpperCase();
  if(ME.name && h.length===4) joinRoom(h); else render();
}
})();
</script>
